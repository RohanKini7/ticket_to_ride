<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket to Kiran</title>
<meta name="description" content="A five-stop celebration train journey for Dr. Kiran.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a33;--muted:#5f6f78;--paper:#fffdf6;--line:#e3ddcc;
  --sign:#14513f;--sign2:#0e3d30;--amber:#ffb627;--board:#141719;
  --red:#d9452b;--gold:#f2b632;--blue:#1f6feb;--life:#c2185b;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:10px;color:var(--ink);font:16px/1.5 var(--ui);
  background:radial-gradient(1000px 500px at 15% -10%,#fff7df 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#dcefd8 0%,transparent 60%),#eef1e8}
main{width:min(1060px,100%);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px rgba(29,42,51,.18),0 2px 0 rgba(255,255,255,.8) inset;border:1px solid #e6e2d6}

/* Station sign header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;background:linear-gradient(180deg,var(--sign),var(--sign2));color:#fff;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 30px);opacity:.25}
.brand{display:flex;align-items:center;gap:14px}
.pict{width:44px;height:44px;border-radius:10px;background:#fff;color:var(--sign);display:grid;place-items:center;font-size:26px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.eyebrow{font:700 .68rem var(--ui);letter-spacing:.22em;text-transform:uppercase;opacity:.75}
h1{margin:0;font:800 clamp(1.5rem,3.6vw,2.2rem)/1.05 var(--ui);letter-spacing:-.01em}
.subtitle{margin:0;opacity:.8}.subtitle[hidden]{display:none}
.head-right{display:flex;align-items:center;gap:10px}
.restart{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:800 1.25rem/1 var(--ui);min-width:40px;height:38px;padding:0 10px;border-radius:9px;cursor:pointer;transition:background .2s}
.restart:hover{background:rgba(255,255,255,.22)}
.restart.confirm{background:var(--red);border-color:var(--red)}
.clock{font:700 1.05rem var(--mono);background:rgba(0,0,0,.25);padding:6px 12px;border-radius:8px;letter-spacing:.06em}

/* Map */
.route-wrap{padding:12px 14px 0}
.map{position:relative;border-radius:16px;overflow:hidden;background:#a7d3e3;border:1px solid #d6e2d2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.map>svg{display:block;width:100%;height:auto;max-height:calc(100vh - 270px);min-height:240px}
.map-label{font:800 11px var(--ui);fill:rgba(20,81,63,.55);letter-spacing:.2em}
.hit{fill:none;stroke:transparent;stroke-width:24;pointer-events:stroke}
.ballast,.sleepers,.rail{fill:none;pointer-events:none}
.ballast{stroke:#d9d1bf;stroke-width:12;stroke-linecap:round;transition:stroke .2s}
.sleepers{stroke:#7d5f42;stroke-width:9;stroke-dasharray:2 5}
.rail{stroke:#69717a;stroke-width:2.4;stroke-linecap:round}
.route-group{opacity:.62;transition:opacity .25s}
.route-group.available,.route-group.selected,.route-group.completed{opacity:1}
.route-group.available{cursor:pointer}
.route-group.available .ballast{stroke:#ffb9a6;animation:halo 1.6s ease-in-out infinite}
.route-group.available.ideal .ballast{stroke:#ffe08a}
.route-group.available:hover .ballast,.route-group.available:focus-visible .ballast{stroke:#ff8a65;stroke-width:18;animation:none}
.route-group.available.ideal:hover .ballast{stroke:#ffcf3f}
.route-group.selected .ballast{stroke:#ffd166;stroke-width:15}
.route-group.completed .ballast{stroke:#cfe0fb}
.route-group.completed .rail{stroke:var(--blue);stroke-width:3}
.route-group:focus{outline:none}
@keyframes halo{50%{stroke-width:17}}
.hurdle-label{font:800 11.5px var(--ui);fill:var(--ink);paint-order:stroke;stroke:#fffdf3;stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .25s;pointer-events:none}
.city .platform{fill:#f4f1ea;stroke:#9aa3a8;stroke-width:1.5}
.city circle{fill:#fff;stroke:var(--sign);stroke-width:4;transition:fill .2s}
.city.visited circle{fill:var(--blue);stroke:#fff}
.city.current circle{fill:var(--red);stroke:#fff;stroke-width:4}
.city .ring{fill:none;stroke:none}
.city.dest .ring{stroke:var(--gold);stroke-width:3.5;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.7);opacity:0}}
.city text{font:800 15px var(--ui);fill:var(--ink);paint-order:stroke;stroke:#fffdf3;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.city text.sub{font:700 11px var(--ui);fill:var(--muted)}
.city text.life{font:800 11.5px var(--ui);fill:var(--life);transition:opacity .4s}
.city text.life.hidden{opacity:0}
.city text.life.pop{animation:lifepop .8s ease}
@keyframes lifepop{0%{opacity:0}40%{opacity:1;fill:#ff3d8b}100%{opacity:1}}
.canopy,.puffs,.shadows{pointer-events:none}
.puff{fill:#fff;animation:puff 1.6s ease-out forwards}
@keyframes puff{from{opacity:.9;transform:translate(0,0) scale(.4)}to{opacity:0;transform:translate(6px,-22px) scale(1.8)}}
.puff{transform-box:fill-box;transform-origin:center}
.cloudshadow{fill:#1b3b2a;opacity:.07;animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1100px)}}
.water-shine{fill:none;stroke:#e9f7fc;stroke-width:1.2;stroke-dasharray:6 10;animation:shine 6s linear infinite;opacity:.8}
@keyframes shine{to{stroke-dashoffset:-64}}
#finish{opacity:0;transition:opacity .5s}
#finish.on{opacity:1}

/* Departure board */
.content{padding:10px 14px 14px}
.board{background:var(--board);border-radius:14px;padding:10px 14px;color:var(--amber);font:700 .92rem var(--mono);box-shadow:inset 0 2px 10px rgba(0,0,0,.6);display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 18px;align-items:center}
.board-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.board-btns:empty{display:none}
.board .button{font-family:var(--ui);text-transform:none;letter-spacing:0;padding:9px 14px}
.board .secondary{background:#2a2f33;color:#e8e8e8;border-color:#3a4045}
.board .k{color:#8b8f94;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
.board .v{letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .cells{display:flex;gap:18px;min-width:0;flex-wrap:wrap}
.board .cell{min-width:0}
.board .status{padding:3px 8px;border-radius:6px;background:rgba(255,182,39,.12)}
.board .status.go{color:#5ee08a;background:rgba(94,224,138,.12)}
.board .status.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.flip{animation:flipin .45s ease}
@keyframes flipin{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.announce{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.announce .msg{color:var(--muted);flex:1;min-width:240px}
.announce .msg strong{color:var(--ink)}
.bar-btns{display:flex;gap:10px;flex-wrap:wrap}
.fact{white-space:nowrap}.fact.no{color:var(--red)}

/* Buttons */
.button{border:0;border-radius:12px;padding:11px 18px;font:800 .97rem var(--ui);cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s}
.button:hover{transform:translateY(-1px)}
.primary{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(217,69,43,.3)}
.primary:hover{background:#c13a22}
.secondary{background:#eef0ea;color:var(--ink);border:1px solid #dcdfd5}
.button.small{padding:5px 10px;font-size:.82rem;background:#fff;border:1px solid #d8dcd2;color:var(--ink);border-radius:9px}
.button.draw{animation:nudge 1.6s ease-out infinite}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(217,69,43,.55)}70%{box-shadow:0 0 0 14px rgba(217,69,43,0)}100%{box-shadow:0 0 0 0 rgba(217,69,43,0)}}
.link{background:none;border:0;color:var(--blue);font:700 .9rem var(--ui);text-decoration:underline;cursor:pointer;padding:0}

/* Ticket card */
.overlay{position:fixed;inset:0;background:rgba(20,30,25,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay[hidden]{display:none}
.card{position:relative;width:min(600px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--paper);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.card.pop{animation:cardin .5s cubic-bezier(.2,.9,.25,1.15)}
@keyframes cardin{from{opacity:0;transform:translateY(26px) rotate(-2deg) scale(.95)}to{opacity:1;transform:none}}
#cardBody{overflow:auto}
.close{position:absolute;top:10px;right:12px;border:0;background:rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer;z-index:2}
.tk-head{background:linear-gradient(180deg,var(--sign),var(--sign2));color:#fff;padding:14px 22px 12px;border-radius:14px 14px 0 0}
.tk-head .eyebrow{opacity:.8}
.tk-route{display:flex;align-items:center;gap:12px;font:800 1.15rem var(--ui);margin-top:4px;flex-wrap:wrap}
.tk-route .arrow{opacity:.7}
.tk-body{padding:18px 24px 6px;position:relative}
.tk-meta{position:relative;display:flex;gap:18px;flex-wrap:wrap;font:700 .72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.tk-meta b{display:block;color:var(--ink);font-size:.86rem}
.stamp{display:inline-block;transform:rotate(-4deg);border:3px solid var(--life);color:var(--life);border-radius:10px;padding:6px 14px;font:800 1.3rem var(--ui);letter-spacing:.01em;margin:4px 0 6px;background:rgba(194,24,91,.05);box-shadow:inset 0 0 0 2px rgba(194,24,91,.15)}
h2{font:800 clamp(1.35rem,3.4vw,1.8rem)/1.15 var(--ui);margin:6px 0 8px}
.tasks{font-size:1.1rem;line-height:1.55;padding-left:1.3em;margin:6px 0 4px}
.tasks li{margin-bottom:10px}
.tasks li::marker{color:var(--red);font-weight:800}
.prompt{font-size:1.1rem;line-height:1.55;margin:0 0 12px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.tk-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px 16px;border-top:2px dashed var(--line);font:700 .7rem var(--mono);color:var(--muted);letter-spacing:.12em}
.barcode{height:28px;width:150px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 12px)}
.finish{text-align:center}
.finish .big{font-size:2.6rem}
.finish p{margin:6px 0}
.recap{color:var(--muted);font-size:.9rem}
.double{max-width:520px;margin:12px auto 4px;display:grid;grid-template-columns:1fr auto 1fr;gap:5px 12px;text-align:left;font-size:.95rem}
.double .h{font:800 .68rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--sign)}
.double .phd{font-weight:800;text-align:right}.double .life{color:var(--life);font-weight:800}.double .dot{color:var(--sign)}
.dare-card{margin-top:14px;background:#fff6dd;border:2px solid #f2d27a;border-radius:12px;padding:12px 16px;text-align:left}
.dare-card p{font-size:1.05rem;font-weight:700;margin:4px 0 2px}
.dare-label{font:800 .7rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#b07d00}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}

/* Official: badge + ticket check animations */
.who{display:flex;align-items:center;gap:8px}
.badge{display:inline-grid;place-items:center;width:34px;height:24px;border-radius:5px;background:var(--red);color:#fff;font:800 .5rem/1.05 var(--ui);letter-spacing:.02em;text-align:center;text-transform:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.dialog[hidden]{display:none}
.fxticket{position:absolute;right:6%;top:14%;width:250px;height:150px;pointer-events:none;z-index:3}
.fxticket .tix{position:absolute;inset:0;border-radius:14px;padding:14px 16px;box-shadow:0 16px 40px rgba(0,0,0,.3);opacity:0;transform:translateX(60px) rotate(6deg);font:700 .9rem var(--ui)}
.tix-top{font:800 1.15rem var(--ui);letter-spacing:.04em;margin-bottom:8px}.tix-top b{margin-left:2px;font-weight:800}
.tix-row{font:700 .78rem var(--mono);opacity:.85;margin:3px 0}
.invalid-tix{background:linear-gradient(135deg,#fdfdfd,#e9eef4);color:#25313d;border:2px solid #c9d3dd}
.free-tix{background:linear-gradient(135deg,#e9f8ee,#c9efd6);color:#14513f;border:2px solid #8fd1a6}
.tix-stamp{position:absolute;right:14px;bottom:16px;font:800 1.5rem var(--ui);letter-spacing:.06em;padding:4px 12px;border:4px solid;border-radius:10px;transform:rotate(-14deg) scale(2.2);opacity:0}
.tix-stamp.bad{color:#d0021b;border-color:#d0021b;background:rgba(255,235,235,.85)}
.tix-stamp.good{color:#118a3e;border-color:#118a3e;background:rgba(232,255,240,.85)}
.fxticket.invalid.go .invalid-tix{animation:tixin .5s ease forwards,shake .5s .95s ease}
.fxticket.invalid.go .invalid-tix .tix-stamp{animation:slam .35s .7s cubic-bezier(.2,1.6,.4,1) forwards}
.fxticket.freepass.go .free-tix{animation:tixin .5s ease forwards}
.fxticket.freepass.go .free-tix .tix-stamp{animation:slam .35s .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes tixin{to{opacity:1;transform:rotate(-3deg)}}
@keyframes slam{to{opacity:1;transform:rotate(-14deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotate(-3deg)}20%{transform:translateX(-10px) rotate(-5deg)}40%{transform:translateX(9px) rotate(-1deg)}60%{transform:translateX(-6px) rotate(-4deg)}80%{transform:translateX(4px) rotate(-2deg)}}
.tasks li.fact{font-weight:800;font-style:italic;color:#4b2a7a;font-size:1.15rem;letter-spacing:.005em}
.episode{font-style:italic;color:#4b2a7a;letter-spacing:-.005em}
.ep{display:block;font:800 .66rem var(--mono);font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:#8a73b3;margin-bottom:1px}
@media(max-width:650px){.fxticket{right:4%;top:6%;width:200px;height:124px}.tix-top{font-size:.95rem}.tix-stamp{font-size:1.1rem}}
/* Conductor dialogue */
.score{font:800 .9rem var(--ui);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:9px;white-space:nowrap}
.score b{font-family:var(--mono);color:#ffd166}
.dialog{position:absolute;right:12px;bottom:12px;width:min(500px,calc(100% - 24px));display:flex;gap:12px;align-items:flex-end;z-index:3}
.dialog.in .bubble{animation:bubin .35s ease}
@keyframes bubin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.avatar{flex:0 0 76px;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);border:3px solid #fff;overflow:hidden;animation:bob 3s ease-in-out infinite}
.avatar svg{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{position:relative;flex:1;background:#fffdf6;border-radius:16px 16px 16px 4px;padding:12px 14px 12px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:1px solid #ece4cf;max-height:calc(100% - 10px);overflow:auto}
.who{font:800 .68rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.say{font-size:1.02rem;line-height:1.45;font-weight:600;cursor:pointer;min-height:1.4em}
.ask{margin-top:8px;font-size:1.05rem;line-height:1.45;background:#f3f6ef;border-left:4px solid var(--sign);padding:8px 10px;border-radius:8px}
.stamp.mini{font-size:1rem;padding:3px 10px;margin:8px 0 0;border-width:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts:empty{display:none}
.acts .button{padding:9px 14px;font-size:.92rem}
.plus{font:800 .8rem var(--mono);background:rgba(255,255,255,.25);padding:2px 6px;border-radius:6px;margin-left:4px}
.button.ghost{background:transparent;color:var(--muted);border:1px solid #ddd6c3}
.pager{display:flex;gap:5px;margin-top:8px}.pager i{width:7px;height:7px;border-radius:50%;background:#ddd6c3}.pager i.on{background:var(--red)}
.mini-btn{position:absolute;left:58px;bottom:62px;z-index:2;width:22px;height:22px;border-radius:50%;border:0;background:var(--sign);color:#fff;font:800 .9rem/1 var(--ui);cursor:pointer}
.dialog.min .bubble{display:none}
.dialog.min .mini-btn{transform:rotate(90deg)}
/* Stamp slots on the board */
.stubs{display:flex;gap:6px;grid-column:1/-1}
.slot{flex:1;height:26px;border-radius:7px;background:#23282c;border:1px dashed #3d454b;color:#5d666d;display:grid;place-items:center;font:700 .78rem var(--mono)}
.slot.now{border-color:var(--amber);color:var(--amber)}
.slot.on{background:#2c1d22;border:1.5px solid #e2557d;color:#fff;font-size:1rem;animation:slotin .5s ease}
@keyframes slotin{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
/* Big stamp effect */
.stampfx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;opacity:0}
.stampfx.go{animation:stampin 1.4s ease forwards}
.stampfx .ring{width:150px;height:150px;border-radius:50%;border:6px solid var(--life);color:var(--life);display:grid;place-items:center;align-content:center;gap:2px;transform:rotate(-12deg);background:rgba(255,240,246,.85);box-shadow:inset 0 0 0 4px rgba(194,24,91,.2)}
.stampfx .em{font-size:3rem;line-height:1}
.stampfx .word{font:800 1rem var(--ui);letter-spacing:.2em}
@keyframes stampin{0%{opacity:0;transform:scale(2.4)}18%{opacity:1;transform:scale(.92)}26%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1) translateY(120px)}}
.rankline{display:inline-block;margin:6px 0 2px;font-weight:800;background:#fff3cf;border:1px solid #f2d27a;padding:4px 12px;border-radius:999px}
@media(max-width:650px){.score{padding:6px 8px;font-size:.8rem}.avatar{flex-basis:56px;width:56px;height:56px}.mini-btn{left:40px;bottom:44px}.say{font-size:.92rem}}

@media(max-width:650px){.map>svg{min-height:0}header{padding:10px 14px}.clock{display:none}.restart{height:34px;min-width:36px}.route-wrap{padding:8px 8px 0}.content{padding:8px}.board{grid-template-columns:1fr}.city text{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
<header>
  <div class="brand">
    <div class="pict" aria-hidden="true">🚆</div>
    <div>
      <div class="eyebrow">A celebratory mini-journey</div>
      <h1 id="title">Ticket to Kiran</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
  </div>
  <div class="head-right"><button class="restart" id="restartTop" title="Start over" aria-label="Start over">↺</button><div class="clock" id="clock" aria-hidden="true">--:--</div></div>
</header>

<div class="route-wrap"><div class="map">
<svg id="map" viewBox="0 0 900 430" role="group" aria-label="The PhD railway: six stations from Augsburg to the defense. Tracks from the current station can be selected.">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ecbb"/><stop offset=".55" stop-color="#c7e2a3"/><stop offset="1" stop-color="#b6d78f"/></linearGradient>
    <radialGradient id="hill" cx=".42" cy=".38" r=".65"><stop offset="0" stop-color="#e4f1c6"/><stop offset=".6" stop-color="#b9d891"/><stop offset="1" stop-color="#9cc275"/></radialGradient>
    <pattern id="field1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="8" height="8" fill="#efe2a4"/><rect width="4" height="8" fill="#e6d68e"/></pattern>
    <pattern id="field2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)"><rect width="8" height="8" fill="#cfe59b"/><rect width="4" height="8" fill="#c2dc8b"/></pattern>
    <pattern id="field3" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(60)"><rect width="7" height="7" fill="#e9d3b0"/><rect width="3" height="7" fill="#dfc49b"/></pattern>

<script src="content.js"></script>
<script>
/* ---------- Content ---------- */
const C = window.TICKET_CONTENT || null;
const STOPS = C ? C.stops : [], FINALE = C ? C.finale : {};
(function validate(){
  const errs=[];
  if(!C)errs.push("content.js did not load (missing file or a syntax error such as a missing comma or quote).");
  else{
    if(C.stations.length!==C.stops.length+1)errs.push(`There are ${C.stations.length} stations but ${C.stops.length} stops — stations must be exactly one more than stops.`);
    if(C.hurdles.length!==C.stops.length)errs.push(`There are ${C.hurdles.length} hurdle legs but ${C.stops.length} stops — they must be equal.`);
    C.hurdles.forEach((h,i)=>{if(!h||!h.ideal||!h.real||Array.isArray(h))errs.push(`Leg ${i+1} needs an "ideal" path and a "real" path, each with a name and a story.`)});
    C.stops.forEach((st,i)=>{if(!st.title||!st.prompt)errs.push(`Stop ${i+1} needs a title and a prompt.`)});
  }
  if(errs.length){document.body.insertAdjacentHTML("afterbegin",`<div style="background:#fde8e6;border:2px solid #c95045;padding:14px 18px;border-radius:12px;margin:10px;font:15px system-ui;max-width:900px"><b>content.js needs a fix:</b><ul>${errs.map(e=>`<li>${e}</li>`).join("")}</ul></div>`);throw new Error(errs.join(" | "))}
  document.title=C.title; document.getElementById("title").textContent=C.title;
  const sub=document.getElementById("subtitle"); sub.textContent=C.subtitle||""; sub.hidden=!C.subtitle;
  document.getElementById("railwayName").textContent=C.railwayName||"";
})();

/* ---------- Map data ---------- */
const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
let seed=11; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const scratch=el("g",{opacity:0,"pointer-events":"none"},document.getElementById("map"));   // for measuring paths

// Stations: evenly spaced, zig-zag up and down
const CITIES={}, LINE=[];
C.stations.forEach((st,i)=>{
  const id="s"+i, n=C.stations.length;
  const x=Math.round(75+(838-75)*i/(n-1));
  const y=i===0?235:(i%2?140:285);
  CITIES[id]={n:st.name,sub:st.sub||"",life:st.life||"",x,y,last:i===n-1}; LINE.push(id);
});
const START=LINE[0];

// Two tracks per leg: ideal = straight, real = tangled
const TRACKS=[];
const SAMPLES=240, LOOPS=4, LOOP_R=17, BULGE=52;
function tangledPath(A,B,side){
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy*side, ny=ux*side;
  const pts=[];
  for(let i=0;i<=SAMPLES;i++){
    const t=i/SAMPLES, w=Math.sin(Math.PI*t);
    const u=L*t - w*LOOP_R*Math.sin(2*Math.PI*LOOPS*t);
    const v=BULGE*w + w*LOOP_R*(1-Math.cos(2*Math.PI*LOOPS*t));
    pts.push([A.x+ux*u+nx*v, A.y+uy*u+ny*v]);
  }
  const mid=pts[SAMPLES/2];
  return {d:"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"), lx:mid[0]+nx*26, ly:mid[1]+ny*26};
}
LINE.slice(0,-1).forEach((a,k)=>{
  const b=LINE[k+1], A=CITIES[a], B=CITIES[b], h=C.hurdles[k];
  const real=Array.isArray(h.real)?h.real[0]:h.real;
  const side=(B.y<A.y)?-1:1;                          // tangle on the outer side of the zig-zag
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
  TRACKS.push({id:`${a}-${b}-ideal`,a,b,k,...h.ideal,ideal:true,d:`M${A.x} ${A.y}L${B.x} ${B.y}`,
               lx:(A.x+B.x)/2+(dy/L)*16*side, ly:(A.y+B.y)/2-(dx/L)*16*side});
  TRACKS.push({id:`${a}-${b}-real`,a,b,k,...real,ideal:false,...tangledPath(A,B,side)});
});

/* ---------- Build the map ---------- */
const tracksG=document.getElementById("tracks"), citiesG=document.getElementById("cities"), labelsG=document.getElementById("labels");
// lead-in track from the left edge into the first station
const SPUR=el("path",{d:`M-200 ${CITIES[START].y+30}C-80 ${CITIES[START].y+30} ${CITIES[START].x-70} ${CITIES[START].y} ${CITIES[START].x} ${CITIES[START].y}`},scratch);
(function drawSpur(){const g=el("g",{class:"route-group completed",style:"opacity:1"},tracksG);
  ["ballast","sleepers","rail"].forEach(c=>el("path",{class:c,d:SPUR.getAttribute("d")},g));})();
TRACKS.forEach(t=>{
  const g=el("g",{class:"route-group"+(t.ideal?" ideal":""),"data-route":t.id,role:"button","aria-label":`${CITIES[t.a].n} to ${CITIES[t.b].n} via ${t.name}`},tracksG);
  el("path",{class:"hit",d:t.d},g);
  el("path",{class:"ballast",d:t.d},g); el("path",{class:"sleepers",d:t.d},g); t.path=el("path",{class:"rail",d:t.d},g); t.g=g;
  g.addEventListener("click",()=>chooseTrack(t.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chooseTrack(t.id)}});
  t.label=el("text",{class:"hurdle-label",x:t.lx,y:t.ly+4,"text-anchor":"middle"},labelsG);
  t.label.textContent=(t.ideal?"✨ ":"🚧 ")+t.name;
});
Object.entries(CITIES).forEach(([id,c])=>{
  const g=el("g",{class:"city","data-city":id},citiesG);
  el("rect",{class:"platform",x:c.x-22,y:c.y-5,width:44,height:10,rx:3},g);
  el("circle",{class:"ring",cx:c.x,cy:c.y,r:13},g); el("circle",{cx:c.x,cy:c.y,r:10},g);
  const below=c.y>200;
  const rows=[["",c.n],["sub",c.sub],["life",c.life]].filter(r=>r[1]);
  rows.forEach(([cls,txt],r)=>{
    const y=below?c.y+34+r*15:c.y-24-(rows.length-1-r)*15-(r===0?4:0);
    const lifeEnd=cls==="life"&&c.last;
    const t=el("text",{class:cls,x:lifeEnd?c.x+42:c.x,y,"text-anchor":lifeEnd?"end":"middle"},g); t.textContent=txt;
    if(cls==="life")c.lifeEl=t;
  });
  c.g=g;
});
const fin=document.getElementById("finish").firstElementChild, lastC=CITIES[LINE[LINE.length-1]];
fin.setAttribute("x",lastC.x+30); fin.setAttribute("y",lastC.y+10);

/* ---------- Scenery: forests the train disappears into, tunnels, trees ---------- */
const sampleD=(d,step)=>{const p=el("path",{d},scratch);const L=p.getTotalLength(),out=[];for(let s=0;s<=L;s+=step){const q=p.getPointAtLength(s);out.push([q.x,q.y])}p.remove();return out};
const TRACK_PTS=TRACKS.flatMap(t=>sampleD(t.d,6)).concat(sampleD(SPUR.getAttribute("d"),6));
const GREENS=["#4f8f3f","#5c9c47","#3f7d35","#6aa84f","#467f3a"];
function tree(g,x,y,r){
  el("circle",{cx:x+r*.25,cy:y+r*.3,r,fill:"rgba(30,50,20,.22)"},g);
  el("circle",{cx:x,cy:y,r,fill:GREENS[(rnd()*GREENS.length)|0]},g);
  el("circle",{cx:x-r*.3,cy:y-r*.3,r:r*.45,fill:"rgba(255,255,255,.18)"},g);
}
(function scenery(){
  const canopy=document.getElementById("canopy");
  TRACKS.forEach(t=>{
    if(!t.ideal){                                       // forest over the middle of every tangled track
      const pts=sampleD(t.d,7), a=Math.floor(pts.length*.36), b=Math.floor(pts.length*.64);
      const g=el("g",{class:"forest"},canopy);
      for(let i=a;i<=b;i++){const[x,y]=pts[i];for(let j=0;j<2;j++)tree(g,x+(rnd()-.5)*30,y+(rnd()-.5)*30,8+rnd()*6)}
    }else if(t.k%2===1){                                // tunnel under a hill on every other ideal track
      const A=CITIES[t.a],B=CITIES[t.b],L=Math.hypot(B.x-A.x,B.y-A.y),ang=Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;
      const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,rx=L*.2;
      const g=el("g",{transform:`translate(${mx} ${my}) rotate(${ang})`},canopy);
      el("ellipse",{cx:3,cy:5,rx:rx+4,ry:28,fill:"rgba(30,50,20,.18)"},g);
      el("ellipse",{cx:0,cy:0,rx,ry:26,fill:"url(#hill)",stroke:"rgba(60,90,40,.25)","stroke-width":1.5},g);
      [-1,1].forEach(s=>el("path",{d:`M${s*(rx-2)} -9A10 9 0 0 ${s>0?1:0} ${s*(rx-2)} 9`,fill:"#3a3a3a",stroke:"#8d8574","stroke-width":3},g));
      for(let i=0;i<5;i++)tree(g,(rnd()-.5)*rx*1.2,(rnd()-.5)*24,5+rnd()*3);
    }
  });
  // scattered trees away from tracks and station labels
  const deco=document.getElementById("decoTrees"), land=document.querySelector('path[fill="url(#grass)"]');
  let placed=0;
  for(let i=0;i<500&&placed<70;i++){
    const x=40+rnd()*820,y=40+rnd()*360;
    if(!land.isPointInFill(Object.assign(document.getElementById("map").createSVGPoint(),{x,y})))continue;
    if(TRACK_PTS.some(p=>Math.hypot(p[0]-x,p[1]-y)<20))continue;
    if(Object.values(CITIES).some(c=>Math.abs(c.x-x)<70&&Math.abs(c.y-y)<70))continue;
    if(Math.hypot(x-460,y-200)<30)continue;
    tree(deco,x,y,4+rnd()*4); placed++;
  }
})();

/* ---------- The train: locomotive + two carriages following the track ---------- */
const trainG=document.getElementById("train"), reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAR_LEN=26, GAP=29;
const cars=[0,1,2].map(i=>{
  const g=el("g",{},trainG);
  el("rect",{x:-14,y:-7.5,width:28,height:15,rx:4,fill:"rgba(0,0,0,.2)",transform:"translate(1.5 2)"},g);
  if(i===0){
    el("rect",{x:-13,y:-7,width:26,height:14,rx:4,fill:"#c8372d",stroke:"#7a1e17","stroke-width":1.2},g);
    el("rect",{x:-11,y:-5,width:9,height:10,rx:2,fill:"#2a2f36"},g);
    el("circle",{cx:7,cy:0,r:3.4,fill:"#2a2f36"},g);
    el("path",{d:"M13 -6L17 0L13 6Z",fill:"#ffd166"},g);
  }else{
    el("rect",{x:-13,y:-6.5,width:26,height:13,rx:3.5,fill:i===1?"#1f6f5a":"#f1e9d2",stroke:i===1?"#0f4a3b":"#b9ab88","stroke-width":1.2},g);
    for(let w=-9;w<=7;w+=5.4)el("rect",{x:w,y:-3.5,width:3.6,height:7,rx:1,fill:i===1?"#cde8df":"#7aa9c9"},g);
  }
  return g;
});
let trail=[];
function trailPush(x,y){const l=trail[trail.length-1];if(!l||Math.hypot(x-l[0],y-l[1])>.8){trail.push([x,y]);if(trail.length>900)trail.shift()}}
function back(d){let acc=0;for(let i=trail.length-1;i>0;i--){const a=trail[i],b=trail[i-1],s=Math.hypot(a[0]-b[0],a[1]-b[1]);if(acc+s>=d){const t=(d-acc)/s;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}acc+=s}return trail[0]||[0,0]}
function poseTrain(){
  cars.forEach((g,i)=>{const c=13+i*GAP,f=back(c-8),r=back(c+8),m=back(c);
    const ang=Math.atan2(f[1]-r[1],f[0]-r[0])*180/Math.PI;g.setAttribute("transform",`translate(${m[0].toFixed(1)} ${m[1].toFixed(1)}) rotate(${ang.toFixed(1)})`)});
}
function samples(pathEl,forward,step=1.2){const L=pathEl.getTotalLength(),o=[];for(let s=0;s<=L;s+=step){const q=pathEl.getPointAtLength(forward?s:L-s);o.push([q.x,q.y])}return o}
let animToken=0, confettiToken=0, lastPuff=0;
function puff(x,y){const now=performance.now();if(now-lastPuff<140||reduceMotion)return;lastPuff=now;
  const c=el("circle",{class:"puff",cx:x,cy:y-6,r:4+rnd()*2},document.getElementById("puffs"));setTimeout(()=>c.remove(),1700)}
function runAlong(pts,dur,done){
  const token=++animToken,t0=performance.now();let idx=0;
  if(reduceMotion){pts.forEach(p=>trailPush(p[0],p[1]));poseTrain();done&&done();return}
  (function frame(now){
    if(token!==animToken)return;
    const t=Math.min(1,(now-t0)/dur), f=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, to=Math.floor(f*(pts.length-1));
    for(;idx<=to;idx++)trailPush(pts[idx][0],pts[idx][1]);
    poseTrain(); const h=trail[trail.length-1]; if(t<1)puff(h[0],h[1]);
    if(t<1)requestAnimationFrame(frame);else done&&done();
  })(t0);
}
function rollIn(){                                     // the train pulls into the first station
  trail=[]; const pts=samples(SPUR,true); pts.slice(0,90).forEach(p=>trailPush(p[0],p[1])); poseTrain();
  runAlong(pts.slice(90),2400,()=>render());
}
function parkAfter(track){                             // place the whole train on the track it just used
  trail=[]; samples(track.path,true).forEach(p=>trailPush(p[0],p[1])); poseTrain();
}

/* ---------- Game: intro with the DB official, then earn a ticket at every station ---------- */
const CONDUCTOR=Object.assign({name:"DB official",intro:[
  {text:"Guten Tag, Kiran! Welcome aboard the PhD Railway. I am your DB official for today. 🎩"},
  {text:"On this railway you need to earn a ticket to move from station to station. Let me check yours… 🔍"},
  {text:"Deutschlandticket ist ungültig! 🚫",fx:"invalid"},
  {text:"But wait… you are only in your Initial Days! Newcomers ride for free. Here is your free pass. 🎫",fx:"freepass"},
  {text:"Choose your track from Augsburg to Initial Days. From then on, you earn every ticket at the station. Gute Fahrt! 🚂"}
]},C.conductor||{});
const INTRO=CONDUCTOR.intro.map(x=>typeof x==="string"?{text:x}:x);
const emojiOf=life=>{const t=(life||"").trim().split(/\s+/)[0]||"";return /\p{Extended_Pictographic}/u.test(t)?t:"✅"};

// phase: intro → pick → ride → arrived (draw ticket) → next stop … → done
const state={city:START,history:[],pending:null,revealed:false,life:false,cardOpen:false,phase:"intro",page:0};
const other=(t,c)=>t.a===c?t.b:t.a;
const byId=id=>TRACKS.find(t=>t.id===id);
function options(){return (state.phase==="pick"||state.phase==="ride")&&state.history.length<STOPS.length?TRACKS.filter(t=>t.a===state.city):[]}

function chooseTrack(id){
  if(!options().some(t=>t.id===id)||state.pending===id)return;
  if(state.pending){const prev=state.history[state.history.length-1];if(prev)parkAfter(byId(prev.id));else{trail=[];samples(SPUR,true).forEach(p=>trailPush(p[0],p[1]));poseTrain()}}
  state.pending=id; state.revealed=false; state.life=false; state.cardOpen=false; state.phase="ride"; render();
  const t=byId(id);
  runAlong(samples(t.path,true),Math.min(3200,1200+t.path.getTotalLength()*3.2),()=>{if(state.pending===id){state.revealed=true;state.phase="arrived";render()}});
}
function nextStop(){
  const t=byId(state.pending);
  stampFx(emojiOf(CITIES[t.b].life));
  state.history.push({id:t.id,from:state.city,to:t.b});
  const done=state.history.length>=STOPS.length;
  Object.assign(state,{city:t.b,pending:null,revealed:false,life:false,cardOpen:false,phase:done?"done":"pick"});
  animToken++; render();
  if(done){confetti();setTimeout(()=>{state.cardOpen=true;render()},1300)}
}
function previousStop(){
  const h=state.history.pop(); animToken++;
  Object.assign(state,{city:h.from,pending:h.id,revealed:true,life:true,cardOpen:true,phase:"arrived"});
  parkAfter(byId(h.id)); render();
}
function restart(){confettiToken++;Object.assign(state,{city:START,history:[],pending:null,revealed:false,life:false,cardOpen:false,phase:"intro",page:0});animToken++;render();rollIn()}
function stampFx(e){const fx=document.getElementById("stampFx");fx.querySelector(".em").textContent=e;fx.classList.remove("go");void fx.offsetWidth;fx.classList.add("go")}

/* ---------- Rendering ---------- */
function renderMap(){
  const opts=options(), used=new Set(state.history.map(h=>h.id));
  const dest=state.pending?byId(state.pending).b:null;
  TRACKS.forEach(t=>{
    const avail=opts.includes(t);
    t.g.classList.toggle("available",avail&&t.id!==state.pending);
    t.g.classList.toggle("selected",t.id===state.pending);
    t.g.classList.toggle("completed",used.has(t.id));
    t.g.setAttribute("tabindex",avail?"0":"-1"); t.g.setAttribute("aria-disabled",avail?"false":"true");
    t.label.style.opacity=(avail||t.id===state.pending)?1:0;
  });
  const visited=new Set(state.history.flatMap(h=>[h.from,h.to]));
  LINE.forEach((id,k)=>{const c=CITIES[id];if(!c.lifeEl)return;
    const shown=k===0||k<=state.history.length||(k===state.history.length+1&&state.revealed&&state.life);
    if(shown&&c.lifeEl.classList.contains("hidden"))c.lifeEl.classList.add("pop");
    c.lifeEl.classList.toggle("hidden",!shown);});
  Object.entries(CITIES).forEach(([id,c])=>{
    c.g.classList.toggle("current",id===state.city);
    c.g.classList.toggle("visited",visited.has(id)&&id!==state.city);
    c.g.classList.toggle("dest",id===dest);
  });
  document.getElementById("finish").classList.toggle("on",state.phase==="done");
}
function stampSlots(){
  const got=state.history.length;
  return `<div class="stubs" aria-label="${got} of ${STOPS.length} tickets">${STOPS.map((_,i)=>{
    const on=i<got, now=i===got;
    return `<span class="slot ${on?"on":""} ${now?"now":""}" title="${CITIES[LINE[i+1]].n}">${on?emojiOf(CITIES[LINE[i+1]].life):"🎫"}</span>`}).join("")}</div>`;
}
let lastBoard="";
function renderStage(){
  const stage=document.getElementById("stage"), n=state.history.length, done=state.phase==="done";
  const from=CITIES[state.city].n, to=done?"—":CITIES[LINE[n+1]].n;
  const p=state.pending&&byId(state.pending);
  const status={intro:["TICKET CHECK","blink"],pick:[n===0?"FREE PASS ✓":"TICKET VALID ✓","go"],ride:["EN ROUTE","go"],arrived:["ARRIVED",""],done:["TERMINUS","go"]}[state.phase];
  const via=p?(p.ideal?"✨ ":"🚧 ")+p.name:"—";
  const key=[n,from,to,via,status[0]].join("|"), fl=key!==lastBoard?" flip":""; lastBoard=key;
  let btns="";
  if(done)btns=`<button class="button secondary" id="back">← Last stop</button>${state.cardOpen?"":`<button class="button primary" id="open">🎓 Open the finale</button>`}`;
  else btns=`${n&&state.phase!=="intro"?'<button class="button secondary" id="back">← Previous stop</button>':""}${state.phase==="arrived"&&!state.cardOpen?`<button class="button primary${state.life?"":" draw"}" id="open">🎟️ ${state.life?"Show your ticket":"Draw your ticket"}</button>`:""}`;
  stage.innerHTML=`<div class="board">
    <div class="cell"><div class="k">Stop</div><div class="v${fl}">${Math.min(n+1,STOPS.length)}/${STOPS.length}</div></div>
    <div class="cells">
      <div class="cell"><div class="k">From</div><div class="v${fl}">${from}</div></div>
      <div class="cell"><div class="k">To</div><div class="v${fl}">${to}</div></div>
      <div class="cell" style="min-width:0;flex:1"><div class="k">Via</div><div class="v${fl}">${via}</div></div>
    </div>
    <div class="cell"><div class="k">Status</div><div class="v status ${status[1]}${fl}">${status[0]}</div></div>
    <div class="board-btns">${btns}</div>
    ${stampSlots()}
  </div>`;

  // ---- the DB official: only during the intro ----
  const dlg=document.getElementById("dialog");
  dlg.hidden=state.phase!=="intro";
  const fx=document.getElementById("fxTicket");
  if(state.phase==="intro"){
    const pg=INTRO[state.page]||{text:""}, last=state.page>=INTRO.length-1;
    const dkey="intro|"+state.page;
    if(dlg.dataset.key!==dkey){
      dlg.dataset.key=dkey; typeText(document.getElementById("say"),pg.text);
      dlg.classList.remove("in"); void dlg.offsetWidth; dlg.classList.add("in");
      fx.className="fxticket"+(pg.fx?" "+pg.fx:""); void fx.offsetWidth; if(pg.fx)fx.classList.add("go");
    }
    document.getElementById("extra").innerHTML=`<div class="pager">${INTRO.map((_,i)=>`<i class="${i===state.page?"on":""}"></i>`).join("")}</div>`;
    document.getElementById("acts").innerHTML=`${last?"":'<button class="button ghost" id="skip">Skip</button>'}<button class="button primary" id="nextPage">${last?"Let’s go! 🚂":"Next ›"}</button>`;
  }else{dlg.dataset.key="";fx.className="fxticket"}

  // ---- ticket / finale card ----
  const overlay=document.getElementById("overlay"), body=document.getElementById("cardBody");
  const show=state.cardOpen&&(done||state.phase==="arrived");
  overlay.hidden=!show;
  if(show){
    const k=done?"f":String(n), same=overlay.dataset.key===k;
    body.innerHTML=done?finaleHTML():ticketHTML(STOPS[n],n); overlay.dataset.key=k;
    if(!same){body.scrollTop=0;const c=document.querySelector(".card");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
  }else overlay.dataset.key="";

  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on("nextPage",()=>{if(state.page<INTRO.length-1)state.page++;else state.phase="pick";render()});
  on("skip",()=>{state.phase="pick";render()});
  on("next",nextStop); on("back",previousStop);
  on("open",()=>{state.cardOpen=true;state.life=true;render()});
  on("alt",()=>{state.alt=!state.alt;renderStage()});
  on("restart",restart);
}
let typeTok=0;
function typeText(elm,text){
  const tok=++typeTok; elm.innerHTML=text;
  if(reduceMotion)return;
  const full=elm.textContent; elm.textContent=""; let i=0;
  elm.onclick=()=>{typeTok++;elm.innerHTML=text};
  (function step(){if(tok!==typeTok)return;i+=2;elm.textContent=full.slice(0,i);if(i<full.length)setTimeout(step,18);else elm.innerHTML=text})();
}
function ticketHTML(s,n){
  const st=CITIES[LINE[n+1]], fromN=CITIES[LINE[n]].n, p=byId(state.pending);
  return `<div class="tk-head"><div class="eyebrow">${C.railwayName||"PhD Railway"} · Single ticket</div>
      <div class="tk-route"><span>${fromN}</span><span class="arrow">→</span><span>${st.n}</span></div></div>
    <div class="tk-body">
      <div class="tk-meta"><span>Stop<b>${n+1} of ${STOPS.length}</b></span><span>Via<b>${p?p.name:"—"}</b></span><span>Class<b>Doctoral</b></span></div>
      ${st.life?`<div class="stamp">${st.life}</div>`:""}
      <h2 class="episode">${s.fact||s.title}</h2>
      <p class="prompt">${state.alt&&s.altPrompt?s.altPrompt:s.prompt}</p>
      ${s.altPrompt?`<button class="link" id="alt">${state.alt?s.mainLabel:s.altLabel}</button>`:""}
      <div class="controls"><button class="button primary" id="next">${n===STOPS.length-1?"✅ Ticket earned — arrive at the terminus 🎓":"✅ Ticket earned — next stop →"}</button></div>
    </div>
    <div class="tk-foot"><span>VALID FOR ONE PhD · NON-REFUNDABLE</span><span class="barcode" aria-hidden="true"></span></div>`;
}
function finaleHTML(){
  const path=CITIES[START].n+state.history.map(h=>` → <em>${byId(h.id).ideal?"✨ ":""}${byId(h.id).name}</em> → ${CITIES[h.to].n}`).join("");
  return `<div class="tk-head"><div class="eyebrow">Terminus · ${state.history.length}/${STOPS.length} tickets earned</div><div class="tk-route"><span>${CITIES[START].n}</span><span class="arrow">→</span><span>${CITIES[state.city].n}</span></div></div>
    <div class="tk-body finish"><div class="big" aria-hidden="true">🏁🎓🎉</div>
      <h2>${FINALE.heading||""}</h2><p>${FINALE.message||""}</p>
      ${C.stations.some(x=>x.life)?`<div class="double"><span class="h" style="text-align:right">PhD</span><span></span><span class="h">Life</span>${C.stations.map(x=>`<span class="phd">${x.name}</span><span class="dot">●</span><span class="life">${x.life||""}</span>`).join("")}</div>`:""}
      ${FINALE.dare?`<div class="dare-card"><div class="dare-label">🎤 Final dare</div><p>${FINALE.dare}</p></div>`:""}
      <p class="recap">Your route: ${path}</p>
      <div class="controls" style="justify-content:center"><button class="button secondary" id="restart">Ride again</button></div>
    </div>
    <div class="tk-foot"><span>JOURNEY COMPLETE · DR. ON BOARD</span><span class="barcode" aria-hidden="true"></span></div>`;
}
function render(){renderMap();renderStage()}

/* ---------- Clock + confetti ---------- */
function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
tick(); setInterval(tick,15000);
function confetti(){
  if(reduceMotion)return;
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=["#d9452b","#f2b632","#1f6feb","#14513f","#c2185b"];
  const bits=Array.from({length:170},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,c:colors[Math.random()*5|0]}));
  const t0=performance.now(), tok=++confettiToken;
  (function f(now){
    if(tok!==confettiToken){ctx.clearRect(0,0,cv.width,cv.height);return}
    ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-3,b.w,6);ctx.restore()});
    if(now-t0<4500)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
// Start over from anywhere: first click asks, second click (within 3 s) restarts
(function(){const b=document.getElementById("restartTop");let timer=null;
  b.onclick=()=>{
    if(!b.classList.contains("confirm")){b.classList.add("confirm");b.textContent="↺?";b.title="Click again to start over";timer=setTimeout(()=>{b.classList.remove("confirm");b.textContent="↺";b.title="Start over"},3000);return}
    clearTimeout(timer);b.classList.remove("confirm");b.textContent="↺";b.title="Start over";restart();
  };})();
document.getElementById("closeCard").onclick=()=>{state.cardOpen=false;renderStage()};
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay"){state.cardOpen=false;renderStage()}});
addEventListener("keydown",e=>{if(e.key==="Escape"&&state.cardOpen){state.cardOpen=false;renderStage()}});
document.getElementById("who").textContent=CONDUCTOR.name;
render();
rollIn();
</script>
