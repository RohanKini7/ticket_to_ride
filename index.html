<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket to Kiran</title>
<meta name="description" content="A five-stop celebration journey for Dr. Kiran.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070a1f;--bg1:#120c35;--ink:#eef0ff;--muted:#a9b0d6;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);--pink:#ff5fd2;--violet:#8b5cff;--cyan:#40e0ff;--gold:#ffd166;--orange:#ff8a5b;--life:#ff8fd0;
  --grad:linear-gradient(110deg,var(--cyan),var(--violet) 45%,var(--pink) 75%,var(--orange));
  --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);background:radial-gradient(1200px 700px at 10% -10%,#2a1a6e 0%,transparent 60%),radial-gradient(900px 600px at 110% 10%,#5b1a6e 0%,transparent 55%),radial-gradient(900px 700px at 50% 120%,#0d3a6e 0%,transparent 60%),var(--bg0);min-height:100vh;display:grid;place-items:center;padding:10px;overflow-x:hidden}
.blob{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.blob.b1{background:var(--violet);top:-160px;left:-120px}
.blob.b2{background:var(--pink);bottom:-200px;right:-140px;animation-delay:-6s}
.blob.b3{background:var(--cyan);top:30%;left:55%;width:380px;height:380px;opacity:.18;animation-delay:-11s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
main{position:relative;z-index:1;width:min(1080px,100%);background:var(--glass);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}
main:before{content:"";position:absolute;inset:0;border-radius:28px;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
header{padding:16px 26px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.2em;font:700 .7rem var(--display);color:var(--muted)}
.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
h1{font:700 clamp(1.8rem,4.2vw,2.7rem)/1.05 var(--display);margin:4px 0 0;letter-spacing:-.02em;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.subtitle{color:var(--muted);margin:2px 0 0}
.subtitle[hidden]{display:none}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 .78rem var(--display);padding:6px 11px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Map */
.route-wrap{padding:6px 18px 0}
.map{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0b1030;box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.map svg{display:block;width:100%;height:auto;max-height:calc(100vh - 230px);min-height:240px}
.map-label{font:700 11px var(--display);fill:rgba(255,255,255,.45);letter-spacing:.22em}
.star{fill:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2}}
.cloud{fill:#fff;opacity:.09;animation:float 40s linear infinite}
@keyframes float{from{transform:translateX(-120px)}to{transform:translateX(1000px)}}
.route{fill:none;stroke:rgba(255,255,255,.06);stroke-width:16;stroke-linecap:round;transition:stroke .2s}
.rail{fill:none;stroke:rgba(255,255,255,.32);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;pointer-events:none}
.route-group{opacity:.55;transition:opacity .25s}
.route-group.available,.route-group.selected,.route-group.completed{opacity:1}
.route-group.available{cursor:pointer}
.route-group.available .rail{stroke:var(--pink);stroke-width:4.5;stroke-dasharray:12 8;animation:flow 1s linear infinite;filter:drop-shadow(0 0 6px var(--pink))}
.route-group.available.ideal .rail{stroke:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.route-group.available:hover .route,.route-group.available:focus-visible .route{stroke:rgba(255,95,210,.28);stroke-width:24}
.route-group.available.ideal:hover .route{stroke:rgba(255,209,102,.28)}
.route-group.completed .rail{stroke:var(--cyan);stroke-width:4.5;stroke-dasharray:none;filter:drop-shadow(0 0 5px var(--cyan))}
.route-group.selected .rail{stroke:#fff;stroke-width:5;stroke-dasharray:none;animation:none;filter:drop-shadow(0 0 8px #fff)}
.route-group.ideal:not(.available):not(.selected):not(.completed) .rail{stroke:rgba(255,209,102,.45)}
.route-group:focus{outline:none}
@keyframes flow{to{stroke-dashoffset:-20}}
.hurdle-label{font:700 11.5px var(--display);fill:#fff;paint-order:stroke;stroke:rgba(11,16,48,.9);stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .25s;pointer-events:none}
.city circle{fill:#141a46;stroke:#8f9bff;stroke-width:3.5;transition:fill .2s}
.city.reachable circle{stroke:var(--pink)}
.city.visited circle{fill:var(--cyan);stroke:#fff}
.city.current circle{fill:var(--pink);stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 8px var(--pink))}
.city .ring{fill:none;stroke:none}
.city.dest .ring{stroke:var(--gold);stroke-width:3;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.8);opacity:0}}
.city text{font:700 15px var(--display);fill:#fff;paint-order:stroke;stroke:rgba(11,16,48,.85);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.city text.sub{font:600 11px var(--body);fill:#c3c9f5}
.city text.life{font:700 11.5px var(--display);fill:var(--life);transition:opacity .4s}
.city text.life.hidden{opacity:0}
.city text.life.pop{animation:lifepop .8s ease}
@keyframes lifepop{0%{opacity:0}40%{opacity:1;fill:#fff}100%{opacity:1}}
#train text{font-size:28px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
#flag{opacity:0;transition:opacity .4s}
#flag.planted{opacity:1}
#flag text{font-size:34px;animation:wave 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:10% 100%}
@keyframes wave{50%{transform:rotate(-8deg)}}
.summit-glow{fill:url(#summitGlow);opacity:.0;transition:opacity 1s}
.summit-glow.on{opacity:1}

/* Bar under the map */
.content{padding:10px 20px 16px}
.stubs{display:flex;gap:6px;margin-bottom:10px}
.stub{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.stub.done{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.stub.now{background:var(--grad);box-shadow:0 0 12px var(--pink)}
.bar{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .leg{margin:0;color:var(--muted);flex:1;min-width:240px}
.bar .leg strong{color:var(--ink)}
.bar-btns{display:flex;gap:10px;flex-wrap:wrap}
.counter{font:700 .74rem var(--display);text-transform:uppercase;letter-spacing:.18em;color:var(--cyan)}
.fact{white-space:nowrap}
.fact.no{color:var(--pink)}

/* Buttons */
.button{border:0;border-radius:14px;padding:11px 18px;font:700 .98rem var(--display);cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;color:var(--ink)}
.button:hover{transform:translateY(-1px)}
.primary{background:var(--grad);background-size:160% 100%;color:#fff;box-shadow:0 8px 24px rgba(255,95,210,.35)}
.primary:hover{background-position:100% 0;box-shadow:0 10px 30px rgba(139,92,255,.5)}
.secondary{background:var(--glass2);border:1px solid var(--line)}
.button.small{padding:5px 10px;font-size:.82rem;background:var(--glass2);border:1px solid var(--line);border-radius:10px}
.button.draw{animation:nudge 1.6s ease-out infinite}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(255,95,210,.7)}70%{box-shadow:0 0 0 14px rgba(255,95,210,0)}100%{box-shadow:0 0 0 0 rgba(255,95,210,0)}}
.link{background:none;border:0;color:var(--cyan);font:600 .9rem var(--body);text-decoration:underline;cursor:pointer;padding:0}

/* Card */
.overlay{position:fixed;inset:0;background:rgba(5,6,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay[hidden]{display:none}
.card{position:relative;width:min(600px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:26px;background:linear-gradient(160deg,rgba(40,30,100,.92),rgba(12,14,40,.95));border:1px solid var(--line);box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 60px rgba(139,92,255,.25)}
.card:before{content:"";position:absolute;inset:0;border-radius:26px;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card.pop{animation:cardin .55s cubic-bezier(.2,.9,.25,1.2)}
@keyframes cardin{from{opacity:0;transform:translateY(30px) rotateX(25deg) scale(.92)}to{opacity:1;transform:none}}
#cardBody{overflow:auto;padding:26px 28px 24px}
.close{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;z-index:1}
h2{font:700 clamp(1.4rem,3.6vw,1.9rem)/1.15 var(--display);margin:6px 0 10px;letter-spacing:-.01em}
.milestone{display:inline-block;font:700 1.45rem var(--display);color:#fff;background:linear-gradient(110deg,rgba(255,95,210,.35),rgba(139,92,255,.35));border:1px solid rgba(255,143,208,.5);border-radius:16px;padding:8px 18px;margin:10px 0 4px;box-shadow:0 0 30px rgba(255,95,210,.25)}
.tasks{font-size:1.12rem;line-height:1.55;padding-left:1.3em;margin:8px 0 4px;color:#e4e7ff}
.tasks li{margin-bottom:10px}
.tasks li::marker{color:var(--pink);font-weight:800}
.prompt{font-size:1.12rem;line-height:1.55;margin:0 0 12px;color:#e4e7ff}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.finish{text-align:center}
.finish .big{font-size:3rem;filter:drop-shadow(0 0 18px rgba(255,209,102,.5))}
.finish p{font-size:1.1rem;margin:6px 0;color:#e4e7ff}
.recap{color:var(--muted)!important;font-size:.9rem!important}
.double{max-width:520px;margin:14px auto 4px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;text-align:left;font-size:.95rem}
.double .h{font:700 .7rem var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.double .phd{font-weight:700;text-align:right}.double .life{color:var(--life);font-weight:700}.double .dot{color:var(--violet)}
.dare-card{margin-top:16px;background:linear-gradient(120deg,rgba(255,209,102,.16),rgba(255,138,91,.16));border:1px solid rgba(255,209,102,.5);border-radius:16px;padding:14px 18px;text-align:left}
.dare-card p{font-size:1.08rem;font-weight:600;margin:4px 0 2px}
.dare-label{font:700 .72rem var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-width:650px){.map svg{min-height:0}header{padding:14px 16px 6px}.route-wrap{padding:6px 8px 0}.content{padding:10px 12px 14px}.city text{font-size:13px}.hud{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<header>
  <div>
    <div class="eyebrow">A celebratory mini-journey</div>
    <h1 id="title">Ticket to Kiran</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="hud" aria-hidden="true"><span class="chip" id="hudAlt">⛰️ Altitude <b>0 m</b></span><span class="chip" id="hudStage">✈️ <b>Landing in Augsburg</b></span></div>
</header>

<div class="route-wrap"><div class="map">
<svg id="map" viewBox="0 0 900 430" role="group" aria-label="The PhD expedition: from landing in Augsburg up the mountain to the summit at the defense. Paths from the current station can be selected.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f2e"/><stop offset=".45" stop-color="#2b1863"/><stop offset=".78" stop-color="#8a2f7a"/><stop offset="1" stop-color="#ff8a5b"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2b7a"/><stop offset="1" stop-color="#21184d"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2f6e"/><stop offset=".6" stop-color="#171a45"/><stop offset="1" stop-color="#0d1030"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/></radialGradient>
    <radialGradient id="summitGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd166" stop-opacity=".75"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="430" fill="url(#sky)"/>
  <circle cx="610" cy="330" r="170" fill="url(#sun)"/>
  <g id="stars"></g>
  <path fill="url(#far)" opacity=".85" d="M0 330L70 290 140 312 220 250 300 290 370 232 450 276 520 214 600 262 690 205 760 250 840 196 900 230V430H0Z"/>
  <g class="clouds"><ellipse class="cloud" cx="80" cy="120" rx="70" ry="14"/><ellipse class="cloud" cx="300" cy="70" rx="90" ry="16" style="animation-duration:55s;animation-delay:-20s"/><ellipse class="cloud" cx="520" cy="150" rx="60" ry="12" style="animation-duration:48s;animation-delay:-35s"/></g>
  <path id="mountain" fill="url(#rock)"/>
  <path id="ridge" fill="none" stroke="rgba(160,170,255,.35)" stroke-width="2"/>
  <path id="snow" fill="#eef2ff" opacity=".95"/>
  <circle id="summitGlowEl" class="summit-glow" r="90"/>
  <text class="map-label" id="railwayName" x="24" y="28"></text>
  <g id="tracks"></g>
  <g id="cities"></g>
  <g id="flag" aria-hidden="true"><text text-anchor="start">🚩</text></g>
  <g id="train" aria-hidden="true"><text text-anchor="middle" dominant-baseline="central">✈️</text></g>
</svg>
</div></div>

<section class="content" id="stage" aria-live="polite"></section>
</main>
<div class="overlay" id="overlay" hidden><div class="card" role="dialog" aria-modal="true" aria-label="Ticket"><button class="close" id="closeCard" aria-label="Close the ticket and look at the map">×</button><div id="cardBody"></div></div></div>

<script src="content.js"></script>
<script>
/* ---------- Content: the five stops (order is fixed, whatever route is chosen) ---------- */
const C = window.TICKET_CONTENT || null;
const STOPS = C ? C.stops : [], FINALE = C ? C.finale : {};
(function validate(){
  const errs=[];
  if(!C)errs.push("content.js did not load (missing file or a syntax error such as a missing comma or quote).");
  else{
    if(C.stations.length!==C.stops.length+1)errs.push(`There are ${C.stations.length} stations but ${C.stops.length} stops — stations must be exactly one more than stops.`);
    if(C.hurdles.length!==C.stops.length)errs.push(`There are ${C.hurdles.length} hurdle legs but ${C.stops.length} stops — they must be equal.`);
    C.hurdles.forEach((h,i)=>{
      if(!h||!h.ideal||!h.real||Array.isArray(h))errs.push(`Leg ${i+1} needs an "ideal" path and a "real" path, each with a name and a story.`);
    });
    C.stops.forEach((st,i)=>{if(!st.title||!st.prompt)errs.push(`Stop ${i+1} needs a title and a prompt.`);});
  }
  if(errs.length){document.body.insertAdjacentHTML("afterbegin",`<div style="background:#fde8e6;border:2px solid #c95045;padding:14px 18px;border-radius:12px;margin:10px;font:15px system-ui;max-width:900px"><b>content.js needs a fix:</b><ul>${errs.map(e=>`<li>${e}</li>`).join("")}</ul></div>`);throw new Error(errs.join(" | "))}
  document.title=C.title; document.getElementById("title").textContent=C.title;
  const sub=document.getElementById("subtitle"); sub.textContent=C.subtitle||""; sub.hidden=!C.subtitle;
  document.getElementById("railwayName").textContent=C.railwayName||"";
})();

/* ---------- Map data: built from content.js ---------- */
// Station positions are computed automatically: evenly spaced, zig-zag up and down.
const CITIES={}, LINE=[];
C.stations.forEach((st,i)=>{
  const id="s"+i, n=C.stations.length;
  const f=i/(n-1);
  const x=Math.round(130+(790-130)*f);
  const y=Math.round(338-232*Math.pow(f,1.2));            // each milestone higher up the mountain
  CITIES[id]={n:st.name,sub:st.sub||"",life:st.life||"",x,y,last:i===n-1}; LINE.push(id);
});
const START=LINE[0];
// Each leg in content.js: { ideal:{name,story}, real:{name,story} }
//   ideal → the straight track (how it should have gone)
//   real  → the tangled track (what actually happened)
const TRACKS=[];
const SAMPLES=240, LOOPS=4, LOOP_R=17, BULGE=52;
function tangledPath(A,B,side){
  // A prolate trochoid along the line A→B: it bulges out and ties itself into loops.
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy*side, ny=ux*side;
  const pts=[];
  for(let i=0;i<=SAMPLES;i++){
    const t=i/SAMPLES, w=Math.sin(Math.PI*t);             // loops fade out near the stations
    const u=L*t - w*LOOP_R*Math.sin(2*Math.PI*LOOPS*t);
    const v=BULGE*w + w*LOOP_R*(1-Math.cos(2*Math.PI*LOOPS*t));
    pts.push([A.x+ux*u+nx*v, A.y+uy*u+ny*v]);
  }
  const mid=pts[SAMPLES/2];
  return {d:"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"), lx:mid[0]+nx*26, ly:mid[1]+ny*26};
}
LINE.slice(0,-1).forEach((a,k)=>{
  const b=LINE[k+1], A=CITIES[a], B=CITIES[b], h=C.hurdles[k];
  const real=Array.isArray(h.real)?h.real[0]:h.real;          // older content with two real paths still works
  // Tangle on the outer side of the zig-zag so neighbouring legs don't collide.
  const side=B.x>A.x?1:-1;                                  // tangles hang below the slope, away from the station labels
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
  TRACKS.push({id:`${a}-${b}-ideal`,a,b,...h.ideal,ideal:true,d:`M${A.x} ${A.y}L${B.x} ${B.y}`,
               lx:(A.x+B.x)/2-(dy/L)*18*side, ly:(A.y+B.y)/2+(dx/L)*18*side+4});
  TRACKS.push({id:`${a}-${b}-real`,a,b,...real,ideal:false,...tangledPath(A,B,side)});
});

/* ---------- Build SVG ---------- */
const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const tracksG=document.getElementById("tracks"), citiesG=document.getElementById("cities");
TRACKS.forEach(t=>{
  const g=el("g",{class:"route-group","data-route":t.id,role:"button","aria-label":`${CITIES[t.a].n} to ${CITIES[t.b].n} via ${t.name}`},tracksG);
  el("path",{class:"route",d:t.d},g); t.path=el("path",{class:"rail",d:t.d},g); t.g=g;
  g.addEventListener("click",()=>chooseTrack(t.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chooseTrack(t.id)}});
});
// Hurdle labels drawn above all tracks so they stay readable
const labelsG=el("g",{},tracksG);
TRACKS.forEach(t=>{t.label=el("text",{class:"hurdle-label",x:t.lx,y:t.ly+4,"text-anchor":"middle"},labelsG);t.label.textContent=(t.ideal?"✨ ":"🚧 ")+t.name;if(t.ideal)t.g.classList.add("ideal")});
Object.entries(CITIES).forEach(([id,c])=>{
  const g=el("g",{class:"city","data-city":id},citiesG);
  el("circle",{class:"ring",cx:c.x,cy:c.y,r:14},g); el("circle",{cx:c.x,cy:c.y,r:12},g);
  const below=id===START;
  // Stacked labels: name, PhD subtitle, life milestone (above or below the dot)
  const rows=[["",c.n],["sub",c.sub],["life",c.life]].filter(r=>r[1]);
  rows.forEach(([cls,txt],r)=>{
    const first=id===START;                // first station: labels to the left of the dot
    const y=first?c.y-10+r*15:c.y-24-(rows.length-1-r)*15-(r===0?4:0);
    const lifeEnd=cls==="life"&&c.last;   // keep the last life label inside the map
    const t=el("text",{class:cls,x:first?c.x-20:lifeEnd?c.x+42:c.x,y,"text-anchor":first||lifeEnd?"end":"middle"},g); t.textContent=txt;
    if(cls==="life")c.lifeEl=t;
  });
  c.g=g;
});

/* ---------- Mountain scene ---------- */
(function scene(){
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const P=LINE.map(id=>CITIES[id]), top=P[P.length-1];
  const ridge=[[0,392]];
  P.forEach((c,i)=>{ if(i){const a=P[i-1];for(let k=1;k<4;k++){const t=k/4;ridge.push([a.x+(c.x-a.x)*t,a.y+(c.y-a.y)*t+16+(rnd()-.5)*18])}}
                     ridge.push([c.x,c.y+(i===P.length-1?-14:16)]); });
  ridge.push([top.x+38,top.y+40],[top.x+70,top.y+70],[900,top.y+110]);
  const d="M"+ridge.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
  document.getElementById("mountain").setAttribute("d",d+"L900 430L0 430Z");
  document.getElementById("ridge").setAttribute("d",d);
  const px=top.x, py=top.y-14;
  document.getElementById("snow").setAttribute("d",`M${px-46} ${py+36}L${px-20} ${py+12}L${px} ${py}L${px+22} ${py+16}L${px+40} ${py+34}L${px+28} ${py+30}L${px+16} ${py+40}L${px+4} ${py+28}L${px-10} ${py+42}L${px-24} ${py+30}Z`);
  const g=document.getElementById("summitGlowEl"); g.setAttribute("cx",top.x); g.setAttribute("cy",top.y);
  const stars=document.getElementById("stars");
  for(let i=0;i<70;i++){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("class","star");c.setAttribute("cx",(rnd()*900).toFixed(1));c.setAttribute("cy",(rnd()*200).toFixed(1));
    c.setAttribute("r",(rnd()*1.3+.3).toFixed(2));c.style.animationDelay=(-rnd()*3).toFixed(2)+"s";c.style.opacity=(.3+rnd()*.7).toFixed(2);stars.appendChild(c)}
  const fl=document.getElementById("flag").firstElementChild; fl.setAttribute("x",top.x+14); fl.setAttribute("y",top.y+8);
})();
// How he travels: plane in, then walk and climb, summit at the end (override in content.js → journey)
const JOURNEY=Object.assign({intro:"✈️",legs:["🚶","🧗","🧗","🧗","🧗"],summit:"🧑‍🎓",
  stages:["Landing in Augsburg","Base camp","Climbing","Climbing","Final ascent","Summit!"]},C.journey||{});
const ALT_TOP=Number(JOURNEY.altitude||4806);

/* ---------- Journey logic ---------- */
const state={city:START,history:[],pending:null,revealed:false,alt:false,dare:null,fact:null,life:false,cardOpen:false};
const other=(t,c)=>t.a===c?t.b:t.a;
const byId=id=>TRACKS.find(t=>t.id===id);
// Tracks run forward only: every hurdle from the current milestone leads to the next milestone.
function options(){
  if(state.history.length>=STOPS.length)return[];
  return TRACKS.filter(t=>t.a===state.city);
}

/* ---------- Train ---------- */
const train=document.getElementById("train"), reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
let animToken=0, confettiToken=0, freshTicket=false, freshStep=false;
let noFlip=false;
function setVehicle(e,fixed){train.firstElementChild.textContent=e;noFlip=!!fixed}
function placeTrain(x,y,faceRight){const fr=faceRight&&!noFlip;train.setAttribute("transform",`translate(${x},${y-8})${fr?" scale(-1,1)":""}`);train.dataset.right=faceRight?1:""}
function flyIn(){
  const A=CITIES[START], token=++animToken;
  setVehicle(JOURNEY.intro,true);
  const path=el("path",{d:`M-40 40Q${A.x-10} ${A.y-260} ${A.x} ${A.y}`,fill:"none"},document.getElementById("map"));
  const L=path.getTotalLength(), t0=performance.now(), dur=reduceMotion?1:2600;
  (function frame(now){
    if(token!==animToken){path.remove();return}
    const t=Math.min(1,(now-t0)/dur), f=1-Math.pow(1-t,3), p=path.getPointAtLength(f*L);
    placeTrain(p.x,p.y,true);
    if(t<1)requestAnimationFrame(frame);else{path.remove();setVehicle(JOURNEY.legs[0]||"🚶");trainAtCity(START);updateHud()}
  })(t0);
}
function updateHud(){
  const n=state.history.length, done=n>=STOPS.length, k=LINE.indexOf(state.city);
  const alt=Math.round(ALT_TOP*Math.pow(k/(LINE.length-1),1.25));
  document.getElementById("hudAlt").innerHTML=`⛰️ Altitude <b>${alt.toLocaleString("de-DE")} m</b>`;
  const st=done?JOURNEY.stages[JOURNEY.stages.length-1]:state.pending?(JOURNEY.stages[n+1]||"Climbing"):JOURNEY.stages[n]||"";
  document.getElementById("hudStage").innerHTML=`${done?"🏔️":state.pending?(JOURNEY.legs[n]||"🧗"):n===0?"📍":"⛺"} <b>${st}</b>`;
}
function trainAtCity(c){const p=CITIES[c];placeTrain(p.x,p.y,!!train.dataset.right)}
function rideTrain(track,fromCity,done){
  setVehicle(JOURNEY.legs[state.history.length]||"🧗");
  const token=++animToken, path=track.path, L=path.getTotalLength(), from=CITIES[fromCity];
  const s=path.getPointAtLength(0), forward=Math.hypot(s.x-from.x,s.y-from.y)<5;
  const at=f=>path.getPointAtLength((forward?f:1-f)*L);
  if(reduceMotion){const e=at(1);placeTrain(e.x,e.y,e.x>from.x);done&&done();return}
  const dur=Math.min(1700,700+L*2.2), t0=performance.now();
  (function frame(now){
    if(token!==animToken)return;
    const t=Math.min(1,(now-t0)/dur), f=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const p=at(f), q=at(Math.min(1,f+.01));
    placeTrain(p.x,p.y,q.x-p.x>0.05?true:q.x-p.x<-0.05?false:!!train.dataset.right);
    if(t<1)requestAnimationFrame(frame);else done&&done();
  })(t0);
}

/* ---------- Actions ---------- */
function chooseTrack(id){
  if(!options().some(t=>t.id===id)||state.pending===id)return;
  state.pending=id; state.fact=null; state.cardOpen=false; renderMap(); renderStage();
  rideTrain(byId(id),state.city,()=>{if(state.pending===id){state.revealed=true;render()}});
}
function nextStop(){
  const t=byId(state.pending);
  state.history.push({id:t.id,from:state.city,to:other(t,state.city)});
  state.city=other(t,state.city); state.pending=null; state.revealed=false; state.alt=false; state.dare=null; state.fact=null; state.life=false; state.cardOpen=state.history.length>=STOPS.length;
  animToken++; trainAtCity(state.city); render();
  if(state.history.length===STOPS.length){setVehicle(JOURNEY.summit,true);trainAtCity(state.city);confetti()}
}
function previousStop(){
  const h=state.history.pop(); animToken++;
  state.city=h.from; state.pending=h.id; state.revealed=true; state.alt=false; state.dare=null; state.fact=null; state.life=true; state.cardOpen=true;
  setVehicle(JOURNEY.legs[state.history.length]||"🧗"); trainAtCity(h.to); render();
}
function restart(){confettiToken++;Object.assign(state,{city:START,history:[],pending:null,revealed:false,alt:false,dare:null,fact:null,life:false,cardOpen:false});animToken++;render();flyIn()}

/* ---------- Rendering ---------- */
function renderMap(){
  const opts=options(), used=new Set(state.history.map(h=>h.id));
  const dest=state.pending?other(byId(state.pending),state.city):null;
  TRACKS.forEach(t=>{
    const avail=opts.includes(t);
    t.g.classList.toggle("available",avail&&t.id!==state.pending);
    t.g.classList.toggle("selected",t.id===state.pending);
    t.g.classList.toggle("completed",used.has(t.id));
    t.g.setAttribute("tabindex",avail?"0":"-1");
    t.g.setAttribute("aria-disabled",avail?"false":"true");
    t.label.style.opacity=(avail||t.id===state.pending)?1:0;
  });
  const reachable=new Set(opts.map(t=>other(t,state.city)));
  const visited=new Set(state.history.flatMap(h=>[h.from,h.to]));
  const finished=state.history.length>=STOPS.length;
  // Life milestones stay hidden until revealed: start station, stations already passed, and the current one once revealed
  LINE.forEach((id,k)=>{const c=CITIES[id];if(!c.lifeEl)return;
    const shown=k===0||k<=state.history.length||(k===state.history.length+1&&state.revealed&&lifeShown());
    if(shown&&c.lifeEl.classList.contains("hidden"))c.lifeEl.classList.add("pop");
    c.lifeEl.classList.toggle("hidden",!shown);});
  Object.entries(CITIES).forEach(([id,c])=>{
    c.g.classList.toggle("current",id===state.city);
    c.g.classList.toggle("visited",visited.has(id)&&id!==state.city);
    c.g.classList.toggle("dest",id===dest);
    c.g.classList.toggle("reachable",reachable.has(id));
  });
}

function stubs(){return `<div class="stubs" aria-hidden="true">${STOPS.map((_,i)=>`<span class="stub ${i<state.history.length?"done":i===state.history.length?"now":""}"></span>`).join("")}</div>`}

const lifeShown=()=>state.life;   // the life milestone appears once the card has been drawn
function ticketBody(s){
  const st=CITIES[LINE[state.history.length+1]];
  let h="";
  if(s.memory){
    h+=`<div class="step"><div class="step-label">Step 1 · The PhD phase</div><h2>${st.n}</h2><p class="prompt">${s.memory}</p></div>`;
    if(!state.life)return h+`<div class="dare-row"><button class="button dare-btn" id="lifeBtn">🎁 Reveal the personal milestone</button><span class="hint" style="margin:0">Told the story? Something else happened on this stop…</span></div>`;
    h+=`<div class="step two${freshStep?" fresh":""}"><div class="step-label">Step 2 · Personal milestone unlocked${st.life?`: <span class="lifechip">${st.life}</span>`:""}</div>`;
  }
  else if(st.life)h+=`<div class="step-label" style="color:#a0436f">Personal milestone: <span class="lifechip">${st.life}</span></div>`;
  h+=`<div class="icon" aria-hidden="true">${s.icon}</div><h2>${s.title}</h2><p class="prompt">${state.alt&&s.altPrompt?s.altPrompt:s.prompt}</p>`;
  if(s.talks)h+=`<div class="talks">${s.talks.map(t=>`<span class="talk">“${t}”</span>`).join("")}</div>`;
  if(s.hint)h+=`<p class="hint">${s.hint}</p>`;
  if(s.stations)h+=`<div class="answer" id="answer">${s.stations.map((x,i)=>`<span class="station"><small>Station ${i+1}</small>${x}</span>`).join('<span class="arrow" aria-hidden="true">→</span>')}</div><button class="button secondary" id="reveal" aria-expanded="false">Reveal answer</button>`;
  if(s.altPrompt)h+=` <button class="link" id="alt">${state.alt?s.mainLabel:s.altLabel}</button>`;
  if(s.memory)h+=`</div>`;
  freshStep=false;
  return h;
}

function finaleHTML(){
  const path=CITIES[START].n+state.history.map(h=>` → <em>${byId(h.id).ideal?"✨ ":""}${byId(h.id).name}</em> → ${CITIES[h.to].n}`).join("");
  return `<div class="finish"><div class="big" aria-hidden="true">♚🎓🎉</div><div class="counter">Checkmate</div><h2>${FINALE.heading}</h2><p>${FINALE.message}</p>${C.stations.some(x=>x.life)?`<div class="counter" style="margin-top:14px">${FINALE.doubleRouteTitle||"Your double route"}</div><div class="double"><span class="h" style="text-align:right">PhD</span><span></span><span class="h">Life</span>${C.stations.map(x=>`<span class="phd">${x.name}</span><span class="dot">●</span><span class="life">${x.life||""}</span>`).join("")}</div>`:""}
    ${FINALE.dare?`<div class="dare-card" style="text-align:left;margin:16px 0"><div class="dare-label">🎤 Final dare</div><p>${FINALE.dare}</p></div>`:""}
    <p class="recap">Your route: ${path}</p><div class="controls" style="justify-content:center"><button class="button secondary" id="restart">Ride again</button></div></div>`;
}

function stopCardHTML(s,n){
  const st=CITIES[LINE[n+1]];
  const tasks=[s.memory,state.alt&&s.altPrompt?s.altPrompt:s.prompt].filter(Boolean);
  return `<div class="counter">Stop ${n+1} of ${STOPS.length} · ${st.n}</div>
    ${st.life?`<div class="milestone">${st.life}</div>`:""}
    <h2>${s.title}</h2>
    ${tasks.length>1?`<ol class="tasks">${tasks.map(t=>`<li>${t}</li>`).join("")}</ol>`:`<p class="prompt">${tasks[0]}</p>`}
    ${s.altPrompt?`<button class="link" id="alt">${state.alt?s.mainLabel:s.altLabel}</button>`:""}
    <div class="controls"><button class="button primary" id="next">${n===STOPS.length-1?"Finish the journey 🎓":"Next stop →"}</button></div>`;
}

function renderStage(){
  const stage=document.getElementById("stage"), n=state.history.length, done=n>=STOPS.length;
  // ---- Compact bar under the map ----
  let bar=stubs();
  if(done){
    bar+=`<div class="bar"><span class="leg">🎓 Journey complete — welcome to the Defense station!</span><span class="bar-btns"><button class="button secondary" id="back">← Last stop</button>${state.cardOpen?"":`<button class="button primary" id="open">🎓 Open the finale</button>`}<button class="button secondary" id="restart2">Ride again</button></span></div>`;
  }else{
    const opts=options(), from=CITIES[state.city].n, to=CITIES[LINE[n+1]].n;
    const p=state.pending&&byId(state.pending);
    const fact=!p||!p.ideal||!state.revealed?"":state.fact===null
      ?` <span class="fact">🕵️ Fact check! <button class="button small" id="factYes">Believable ✅</button><button class="button small" id="factNo">Nice try! ❌</button></span>`
      :state.fact?` <span class="fact">🕵️ The room believes you.</span>`:` <span class="fact no">🕵️ Nice try, Dr. Kiran!</span>`;
    const status=!p?""
      :!state.revealed?(p.ideal?`${JOURNEY.legs[n]||"🧗"} Cruising the ideal path to ${to}… suspiciously smooth.`:`${JOURNEY.legs[n]||"🧗"} Fighting through “${p.name}”…`)
      :`${p.ideal?"✨":"🚧"} <strong>${p.name}</strong> — ${p.story}${fact}`;
    bar+=`<div class="bar"><span class="counter" style="margin:0">Stop ${n+1} of ${STOPS.length}</span>${status?`<span class="leg">${status}</span>`:""}<span class="bar-btns">${n?'<button class="button secondary" id="back">← Previous stop</button>':""}${state.revealed&&!state.cardOpen?`<button class="button primary${state.life?"":" draw"}" id="open">🎟️ ${state.life?"Show the card":"Draw the card"}</button>`:""}</span></div>`;
  }
  stage.innerHTML=bar;

  // ---- The ticket card (opens on arrival) ----
  const overlay=document.getElementById("overlay"), body=document.getElementById("cardBody");
  const show=state.cardOpen&&(done||state.revealed);
  overlay.hidden=!show;
  if(show){
    const keep=body.scrollTop, same=overlay.dataset.key===String(n);
    body.innerHTML=done?finaleHTML():stopCardHTML(STOPS[n],n);
    overlay.dataset.key=String(n);
    body.scrollTop=same?keep:0;
    if(!same)document.querySelector(".card").classList.remove("pop"),void document.querySelector(".card").offsetWidth,document.querySelector(".card").classList.add("pop");
  }else overlay.dataset.key="";

  const $=id=>document.getElementById(id), on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>chooseTrack(b.dataset.choice));
  on("factYes",()=>{state.fact=true;renderStage()});
  on("factNo",()=>{state.fact=false;renderStage()});
  on("lifeBtn",()=>{state.life=true;freshStep=true;render()});
  on("alt",()=>{state.alt=!state.alt;renderStage()});
  on("next",nextStop);
  on("back",previousStop);
  on("open",()=>{state.cardOpen=true;state.life=true;render()});
  on("restart",restart); on("restart2",restart);
}
function render(){renderMap();renderStage();
  const done=state.history.length>=STOPS.length;
  document.getElementById("flag").classList.toggle("planted",done);
  document.getElementById("summitGlowEl").classList.toggle("on",done);
  updateHud()}

/* ---------- Finale confetti (no libraries) ---------- */
function confetti(){
  if(reduceMotion)return;
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=["#c95045","#f3c65e","#286c8e","#3a806c","#17324d"];
  const bits=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,c:colors[Math.random()*5|0]}));
  const t0=performance.now(), tok=++confettiToken;
  (function f(now){
    if(tok!==confettiToken){ctx.clearRect(0,0,cv.width,cv.height);return}
    ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-3,b.w,6);ctx.restore()});
    if(now-t0<4500)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

document.getElementById("closeCard").onclick=()=>{state.cardOpen=false;renderStage()};
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay"){state.cardOpen=false;renderStage()}});
addEventListener("keydown",e=>{if(e.key==="Escape"&&state.cardOpen){state.cardOpen=false;renderStage()}});
render();
flyIn();
</script>
</body>
</html>
