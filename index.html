<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket to Kiran</title>
<meta name="description" content="A five-stop celebration journey for Dr. Kiran.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<style>
:root{--navy:#17324d;--cream:#fffaf0;--red:#c95045;--ink:#203344;--muted:#617282;--green:#3a806c;--blue:#286c8e;--gold:#f3c65e;--map:#e8efdf;--water:#d9e9ed}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#f5fbfc,#dfe9ec);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(1000px,100%);background:var(--cream);border:1px solid #d9e0da;border-radius:24px;box-shadow:0 20px 60px #17324d22;overflow:hidden}
header{padding:25px 36px 19px;background:var(--navy);color:#fff;position:relative}
header:after{content:"";position:absolute;inset:auto 0 0;height:5px;background:repeating-linear-gradient(90deg,var(--gold) 0 24px,transparent 24px 34px)}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:800;color:#a9d4df}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:7px 0 8px}
.subtitle{color:#d7e5eb;margin:0}

/* Map */
.route-wrap{padding:18px 28px 0}
.map{background:var(--map);border:1px solid #d3dfd1;border-radius:18px;overflow:hidden;position:relative;box-shadow:inset 0 0 30px #fff9}
.map svg{display:block;width:100%;height:auto}
.sea{fill:var(--water)}.land{fill:#e7efdc}.terrain{fill:#dce9d2}
.map-label{font:800 12px system-ui,sans-serif;fill:#82977c;letter-spacing:.15em}
.route{fill:none;stroke:#fdf8e8;stroke-width:15;stroke-linecap:round}
.rail{fill:none;stroke:#9a866a;stroke-width:4;stroke-dasharray:2 8;stroke-linecap:round;pointer-events:none}
.route-group{opacity:.6;transition:opacity .25s}
.route-group.available,.route-group.selected,.route-group.completed{opacity:1}
.route-group.available{cursor:pointer}
.route-group.available .route{stroke:#fff}
.route-group.available .rail{stroke:var(--red);stroke-width:6;stroke-dasharray:14 8;animation:flow 1.1s linear infinite}
.route-group.available:hover .route,.route-group.available:focus-visible .route{stroke:var(--gold);stroke-width:20}
.route-group.completed .rail{stroke:var(--blue);stroke-width:6;stroke-dasharray:none}
.route-group.selected .rail{stroke:var(--gold);stroke-width:7;stroke-dasharray:none;animation:none}
.route-group.selected .route{stroke:#fff}
.route-group:focus{outline:none}
@keyframes flow{to{stroke-dashoffset:-22}}
.city circle{fill:var(--cream);stroke:#829b83;stroke-width:4;transition:fill .2s}
.city.reachable{cursor:pointer}
.city.reachable circle{stroke:var(--red)}
.city.visited circle{fill:var(--blue);stroke:#fff}
.city.current circle{fill:var(--red);stroke:#fff;stroke-width:5}
.city .ring{fill:none;stroke:none}
.city.dest .ring{stroke:var(--gold);stroke-width:4;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.6);opacity:0}}
.city text{font:700 16px system-ui,sans-serif;fill:var(--navy);paint-order:stroke;stroke:var(--map);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
#train text{font-size:27px;filter:drop-shadow(0 2px 1px #0004)}
.map-caption{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 14px;background:#f6f7eb;color:var(--muted);font-size:.8rem;flex-wrap:wrap}
.map-caption strong{color:var(--navy)}
.key{display:flex;gap:14px;flex-wrap:wrap}
.sw{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px}

/* Content */
.content{padding:14px 28px 16px}
.stubs{display:flex;gap:6px;margin-bottom:12px}
.stub{flex:1;height:8px;border-radius:4px;background:#e3e9e6}
.stub.done{background:var(--blue)}.stub.now{background:var(--red)}
.counter{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--green)}
h2{font-size:clamp(1.4rem,4vw,1.9rem);margin:5px 0 10px;color:var(--navy)}
.intro,.prompt{font-size:1.15rem;line-height:1.55;max-width:780px;margin:0 0 14px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 16px}
.route-choices{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 16px}
.choice{border:1px solid #cbd8d5;background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font:700 .92rem system-ui,sans-serif;cursor:pointer}
.choice:hover,.choice.selected{border-color:var(--red);background:#fff0e9}
.choice.selected:before{content:"✓ ";color:var(--red)}
.ticket{position:relative;background:#fff;border:2px dashed #d5c7a4;border-radius:16px;padding:18px 22px;margin:4px 0 6px}
.ticket.fresh,.ticket.mystery{animation:reveal .45s ease}
.ticket.mystery{color:var(--muted);text-align:center;font-weight:600;background:repeating-linear-gradient(-45deg,#fffdf6 0 12px,#fbf5e4 12px 24px)}
.ticket .icon{font-size:2rem;line-height:1;margin-bottom:4px}
@keyframes reveal{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.talks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.talk{background:#eef3f6;border-radius:10px;padding:7px 11px;font-weight:700;color:var(--navy);font-size:.95rem}
.answer{display:none;margin:4px 0 16px}
.answer.show{display:flex;gap:8px;flex-wrap:wrap;align-items:center;animation:reveal .4s ease}
.station{background:#eef5f1;border:2px solid var(--green);border-radius:12px;padding:8px 13px;font-weight:700;color:var(--navy)}
.station small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.arrow{color:var(--green);font-weight:800}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.button{border:0;border-radius:12px;padding:12px 18px;font:700 1rem system-ui,sans-serif;cursor:pointer;transition:transform .12s,background .2s}
.button:hover{transform:translateY(-1px)}
.primary{background:var(--red);color:#fff}.primary:hover{background:#ad4038}
.secondary{background:#e8eef0;color:var(--navy)}
.link{background:none;border:0;color:var(--blue);font:600 .9rem system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.finish{text-align:center;padding:10px 0}
.finish .big{font-size:3rem}
.finish p{font-size:1.2rem;margin:6px 0}
.recap{color:var(--muted);font-size:.95rem!important}
.footer{border-top:1px solid #d8e1e5;padding:13px 36px;color:var(--muted);font-size:.84rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* PhD railway */
.hurdle-label{font:700 11.5px system-ui,sans-serif;fill:var(--navy);paint-order:stroke;stroke:#fffdf4;stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .25s;pointer-events:none}
.city text.sub{font:600 11px system-ui,sans-serif;fill:var(--muted)}
.city text.life{font:700 11.5px system-ui,sans-serif;fill:#a0436f}
.double{max-width:680px;margin:16px auto 4px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;text-align:left;font-size:.95rem}
.double .h{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--green)}
.double .phd{color:var(--navy);font-weight:700;text-align:right}.double .life{color:#a0436f;font-weight:700}.double .dot{color:var(--muted)}
.leg{margin:10px 0 0;color:var(--muted)}
.cleared{background:#f3f7fa;border-radius:10px;padding:8px 12px;margin:0 0 12px;color:var(--muted);font-size:.95rem}
.cleared strong{color:var(--navy)}
.cleared.ideal{background:#fff8e3}
.route-group.ideal:not(.available):not(.selected):not(.completed) .rail{stroke:#c9a23a}
.ideal-txt{color:#a17a12;font-weight:700}
.factcheck{background:#eef3f6;border-radius:10px;padding:8px 12px;margin:-4px 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.factcheck.no{background:#fde8e6}
.button.small{padding:6px 11px;font-size:.88rem;background:#fff;border:1px solid #cbd8d5;color:var(--navy)}
.step-label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--green);margin-bottom:2px}
.step.two{margin-top:18px;padding-top:16px;border-top:2px dashed #ecd3df}
.step.two .step-label{color:#a0436f}
.step.two.fresh{animation:reveal .5s ease}
.lifechip{display:inline-block;background:#fbe9f1;color:#a0436f;border-radius:999px;padding:2px 10px;letter-spacing:0;text-transform:none;font-size:.95rem}
.city text.life{transition:opacity .4s}
.city text.life.hidden{opacity:0}
.city text.life.pop{animation:lifepop .7s ease}
@keyframes lifepop{0%{opacity:0}40%{opacity:1;fill:#e0559a}100%{opacity:1}}
/* Compact bar + ticket card */
.bar{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.bar .leg{margin:0;color:var(--muted)}
.bar .route-choices{margin:0}
.bar-btns{display:flex;gap:10px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:#17324d55;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay[hidden]{display:none}
.card{position:relative;background:var(--cream);border:2px dashed #d5c7a4;border-radius:20px;box-shadow:0 24px 70px #17324d55;width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column}
.card.pop{animation:cardin .4s ease}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
#cardBody{overflow:auto;padding:24px 26px 22px}
.close{position:absolute;top:8px;right:10px;border:0;background:#e8eef0;color:var(--navy);width:34px;height:34px;border-radius:50%;font-size:1.3rem;cursor:pointer;z-index:1}
.card .cleared{margin-right:30px}
.milestone{display:inline-block;font-size:1.5rem;font-weight:800;color:#a0436f;background:#fbe9f1;border-radius:16px;padding:8px 18px;margin:8px 0 4px}
.tasks{font-size:1.15rem;line-height:1.55;padding-left:1.3em;margin:6px 0 4px}
.tasks li{margin-bottom:10px}
.fact{white-space:nowrap}
.fact.no{color:var(--red)}
.button.draw{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%{box-shadow:0 0 0 0 #c9504588}70%{box-shadow:0 0 0 12px #c9504500}100%{box-shadow:0 0 0 0 #c9504500}}
/* Dares */
.dare-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px dashed #e0d5b8}
.dare-btn{background:var(--gold);color:var(--navy)}.dare-btn:hover{background:#eab83f}
.dare-card{margin-top:18px;background:linear-gradient(135deg,#fff4d6,#ffe9c7);border:2px solid var(--gold);border-radius:14px;padding:14px 18px;transform:rotate(-.6deg);animation:flip .45s ease;box-shadow:0 6px 18px #c9504522}
.dare-card p{font-size:1.15rem;font-weight:600;color:var(--navy);margin:4px 0 8px}
.dare-label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--red)}
@keyframes flip{from{opacity:0;transform:rotateX(70deg)}to{opacity:1;transform:rotate(-.6deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-width:650px){body{padding:8px}main{border-radius:16px}header{padding:20px 22px 17px}.route-wrap{padding:12px 10px 0}.content{padding:19px 20px 25px}.footer{padding:12px 20px}.city text{font-size:14px}.map-caption{font-size:.7rem;padding:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* Fit everything on one screen */
header{padding:16px 30px 14px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:4px 0 4px}
.subtitle{font-size:.92rem}
.route-wrap{padding:12px 24px 0}
.map svg{max-height:calc(100vh - 330px);min-height:240px}
.map{background:var(--water)}
body{padding:10px}
.map-caption{padding:6px 14px}
.footer{padding:8px 30px}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
<header>
  <div class="eyebrow">A celebratory mini-journey</div>
  <h1 id="title">Ticket to Kiran</h1>
  <p class="subtitle" id="subtitle"></p>
</header>

<div class="route-wrap"><div class="map">
<svg id="map" viewBox="0 0 900 430" role="group" aria-label="The PhD railway: six milestones from Augsburg to the defense, with three hurdle tracks between each pair. Tracks from the current station can be selected.">
  <path class="sea" d="M0 0H900V430H0Z"/>
  <path class="land" d="M85 45L200 32 260 58 330 35 390 62 465 38 525 66 610 48 680 79 760 57 825 92 850 150 818 198 842 245 800 291 825 340 770 392 690 383 630 407 555 378 493 402 432 372 360 396 300 359 235 380 184 341 127 358 93 315 65 278 82 226 57 185 83 131 66 87Z"/>
  <text class="map-label" id="railwayName" x="70" y="34" style="fill:#7d9aa5"></text>
  <g id="tracks"></g>
  <g id="cities"></g>
  <g id="train" aria-hidden="true"><text text-anchor="middle" dominant-baseline="central">🚂</text></g>
</svg>
</div></div>

<section class="content" id="stage" aria-live="polite"></section>
</main>
<div class="overlay" id="overlay" hidden><div class="card" role="dialog" aria-modal="true" aria-label="Ticket"><button class="close" id="closeCard" aria-label="Close the ticket and look at the map">×</button><div id="cardBody"></div></div></div>

<script src="content.js"></script>
<script>
/* ---------- Content: the five stops (order is fixed, whatever route is chosen) ---------- */
const C = window.TICKET_CONTENT || null;
const STOPS = C ? C.stops : [], FINALE = C ? C.finale : {};
(function validate(){
  const errs=[];
  if(!C)errs.push("content.js did not load (missing file or a syntax error such as a missing comma or quote).");
  else{
    if(C.stations.length!==C.stops.length+1)errs.push(`There are ${C.stations.length} stations but ${C.stops.length} stops — stations must be exactly one more than stops.`);
    if(C.hurdles.length!==C.stops.length)errs.push(`There are ${C.hurdles.length} hurdle legs but ${C.stops.length} stops — they must be equal.`);
    C.hurdles.forEach((h,i)=>{
      if(!h||!h.ideal||!h.real||Array.isArray(h))errs.push(`Leg ${i+1} needs an "ideal" path and a "real" path, each with a name and a story.`);
    });
    C.stops.forEach((st,i)=>{if(!st.title||!st.prompt)errs.push(`Stop ${i+1} needs a title and a prompt.`);});
  }
  if(errs.length){document.body.insertAdjacentHTML("afterbegin",`<div style="background:#fde8e6;border:2px solid #c95045;padding:14px 18px;border-radius:12px;margin:10px;font:15px system-ui;max-width:900px"><b>content.js needs a fix:</b><ul>${errs.map(e=>`<li>${e}</li>`).join("")}</ul></div>`);throw new Error(errs.join(" | "))}
  document.title=C.title; document.getElementById("title").textContent=C.title;
  const sub=document.getElementById("subtitle"); sub.textContent=C.subtitle||""; sub.hidden=!C.subtitle;
  document.getElementById("railwayName").textContent=C.railwayName||"";
})();

/* ---------- Map data: built from content.js ---------- */
// Station positions are computed automatically: evenly spaced, zig-zag up and down.
const CITIES={}, LINE=[];
C.stations.forEach((st,i)=>{
  const id="s"+i, n=C.stations.length;
  const x=Math.round(75+(838-75)*i/(n-1));
  const y=i===0?235:(i%2?140:285);
  CITIES[id]={n:st.name,sub:st.sub||"",life:st.life||"",x,y,last:i===n-1}; LINE.push(id);
});
const START=LINE[0];
// Each leg in content.js: { ideal:{name,story}, real:{name,story} }
//   ideal → the straight track (how it should have gone)
//   real  → the tangled track (what actually happened)
const TRACKS=[];
const SAMPLES=240, LOOPS=4, LOOP_R=17, BULGE=52;
function tangledPath(A,B,side){
  // A prolate trochoid along the line A→B: it bulges out and ties itself into loops.
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy*side, ny=ux*side;
  const pts=[];
  for(let i=0;i<=SAMPLES;i++){
    const t=i/SAMPLES, w=Math.sin(Math.PI*t);             // loops fade out near the stations
    const u=L*t - w*LOOP_R*Math.sin(2*Math.PI*LOOPS*t);
    const v=BULGE*w + w*LOOP_R*(1-Math.cos(2*Math.PI*LOOPS*t));
    pts.push([A.x+ux*u+nx*v, A.y+uy*u+ny*v]);
  }
  const mid=pts[SAMPLES/2];
  return {d:"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"), lx:mid[0]+nx*26, ly:mid[1]+ny*26};
}
LINE.slice(0,-1).forEach((a,k)=>{
  const b=LINE[k+1], A=CITIES[a], B=CITIES[b], h=C.hurdles[k];
  const real=Array.isArray(h.real)?h.real[0]:h.real;          // older content with two real paths still works
  // Tangle on the outer side of the zig-zag so neighbouring legs don't collide.
  const side=(B.y<A.y)?-1:1;
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
  TRACKS.push({id:`${a}-${b}-ideal`,a,b,...h.ideal,ideal:true,d:`M${A.x} ${A.y}L${B.x} ${B.y}`,
               lx:(A.x+B.x)/2+(dy/L)*14*side, ly:(A.y+B.y)/2-(dx/L)*14*side});
  TRACKS.push({id:`${a}-${b}-real`,a,b,...real,ideal:false,...tangledPath(A,B,side)});
});

/* ---------- Build SVG ---------- */
const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const tracksG=document.getElementById("tracks"), citiesG=document.getElementById("cities");
TRACKS.forEach(t=>{
  const g=el("g",{class:"route-group","data-route":t.id,role:"button","aria-label":`${CITIES[t.a].n} to ${CITIES[t.b].n} via ${t.name}`},tracksG);
  el("path",{class:"route",d:t.d},g); t.path=el("path",{class:"rail",d:t.d},g); t.g=g;
  g.addEventListener("click",()=>chooseTrack(t.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chooseTrack(t.id)}});
});
// Hurdle labels drawn above all tracks so they stay readable
const labelsG=el("g",{},tracksG);
TRACKS.forEach(t=>{t.label=el("text",{class:"hurdle-label",x:t.lx,y:t.ly+4,"text-anchor":"middle"},labelsG);t.label.textContent=(t.ideal?"✨ ":"🚧 ")+t.name;if(t.ideal)t.g.classList.add("ideal")});
Object.entries(CITIES).forEach(([id,c])=>{
  const g=el("g",{class:"city","data-city":id},citiesG);
  el("circle",{class:"ring",cx:c.x,cy:c.y,r:14},g); el("circle",{cx:c.x,cy:c.y,r:12},g);
  const below=c.y>200;
  // Stacked labels: name, PhD subtitle, life milestone (above or below the dot)
  const rows=[["",c.n],["sub",c.sub],["life",c.life]].filter(r=>r[1]);
  rows.forEach(([cls,txt],r)=>{
    const y=below?c.y+36+r*15:c.y-24-(rows.length-1-r)*15-(r===0?4:0);
    const lifeEnd=cls==="life"&&c.last;   // keep the last life label inside the map
    const t=el("text",{class:cls,x:lifeEnd?c.x+42:c.x,y,"text-anchor":lifeEnd?"end":"middle"},g); t.textContent=txt;
    if(cls==="life")c.lifeEl=t;
  });
  c.g=g;
});

/* ---------- Journey logic ---------- */
const state={city:START,history:[],pending:null,revealed:false,alt:false,dare:null,fact:null,life:false,cardOpen:false};
const other=(t,c)=>t.a===c?t.b:t.a;
const byId=id=>TRACKS.find(t=>t.id===id);
// Tracks run forward only: every hurdle from the current milestone leads to the next milestone.
function options(){
  if(state.history.length>=STOPS.length)return[];
  return TRACKS.filter(t=>t.a===state.city);
}

/* ---------- Train ---------- */
const train=document.getElementById("train"), reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
let animToken=0, confettiToken=0, freshTicket=false, freshStep=false;
function placeTrain(x,y,faceRight){train.setAttribute("transform",`translate(${x},${y-5})${faceRight?" scale(-1,1)":""}`);train.dataset.right=faceRight?1:""}
function trainAtCity(c){const p=CITIES[c];placeTrain(p.x,p.y,!!train.dataset.right)}
function rideTrain(track,fromCity,done){
  const token=++animToken, path=track.path, L=path.getTotalLength(), from=CITIES[fromCity];
  const s=path.getPointAtLength(0), forward=Math.hypot(s.x-from.x,s.y-from.y)<5;
  const at=f=>path.getPointAtLength((forward?f:1-f)*L);
  if(reduceMotion){const e=at(1);placeTrain(e.x,e.y,e.x>from.x);done&&done();return}
  const dur=Math.min(1700,700+L*2.2), t0=performance.now();
  (function frame(now){
    if(token!==animToken)return;
    const t=Math.min(1,(now-t0)/dur), f=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const p=at(f), q=at(Math.min(1,f+.01));
    placeTrain(p.x,p.y,q.x-p.x>0.05?true:q.x-p.x<-0.05?false:!!train.dataset.right);
    if(t<1)requestAnimationFrame(frame);else done&&done();
  })(t0);
}

/* ---------- Actions ---------- */
function chooseTrack(id){
  if(!options().some(t=>t.id===id)||state.pending===id)return;
  state.pending=id; state.fact=null; state.cardOpen=false; renderMap(); renderStage();
  rideTrain(byId(id),state.city,()=>{if(state.pending===id){state.revealed=true;render()}});
}
function nextStop(){
  const t=byId(state.pending);
  state.history.push({id:t.id,from:state.city,to:other(t,state.city)});
  state.city=other(t,state.city); state.pending=null; state.revealed=false; state.alt=false; state.dare=null; state.fact=null; state.life=false; state.cardOpen=state.history.length>=STOPS.length;
  animToken++; trainAtCity(state.city); render();
  if(state.history.length===STOPS.length)confetti();
}
function previousStop(){
  const h=state.history.pop(); animToken++;
  state.city=h.from; state.pending=h.id; state.revealed=true; state.alt=false; state.dare=null; state.fact=null; state.life=true; state.cardOpen=true;
  trainAtCity(h.to); render();
}
function restart(){confettiToken++;Object.assign(state,{city:START,history:[],pending:null,revealed:false,alt:false,dare:null,fact:null,life:false,cardOpen:false});animToken++;trainAtCity(START);render()}

/* ---------- Rendering ---------- */
function renderMap(){
  const opts=options(), used=new Set(state.history.map(h=>h.id));
  const dest=state.pending?other(byId(state.pending),state.city):null;
  TRACKS.forEach(t=>{
    const avail=opts.includes(t);
    t.g.classList.toggle("available",avail&&t.id!==state.pending);
    t.g.classList.toggle("selected",t.id===state.pending);
    t.g.classList.toggle("completed",used.has(t.id));
    t.g.setAttribute("tabindex",avail?"0":"-1");
    t.g.setAttribute("aria-disabled",avail?"false":"true");
    t.label.style.opacity=(avail||t.id===state.pending||used.has(t.id))?1:0;
  });
  const reachable=new Set(opts.map(t=>other(t,state.city)));
  const visited=new Set(state.history.flatMap(h=>[h.from,h.to]));
  const finished=state.history.length>=STOPS.length;
  // Life milestones stay hidden until revealed: start station, stations already passed, and the current one once revealed
  LINE.forEach((id,k)=>{const c=CITIES[id];if(!c.lifeEl)return;
    const shown=k===0||k<=state.history.length||(k===state.history.length+1&&state.revealed&&lifeShown());
    if(shown&&c.lifeEl.classList.contains("hidden"))c.lifeEl.classList.add("pop");
    c.lifeEl.classList.toggle("hidden",!shown);});
  Object.entries(CITIES).forEach(([id,c])=>{
    c.g.classList.toggle("current",id===state.city);
    c.g.classList.toggle("visited",visited.has(id)&&id!==state.city);
    c.g.classList.toggle("dest",id===dest);
    c.g.classList.toggle("reachable",reachable.has(id));
  });
}

function stubs(){return `<div class="stubs" aria-hidden="true">${STOPS.map((_,i)=>`<span class="stub ${i<state.history.length?"done":i===state.history.length?"now":""}"></span>`).join("")}</div>`}

const lifeShown=()=>state.life;   // the life milestone appears once the card has been drawn
function ticketBody(s){
  const st=CITIES[LINE[state.history.length+1]];
  let h="";
  if(s.memory){
    h+=`<div class="step"><div class="step-label">Step 1 · The PhD phase</div><h2>${st.n}</h2><p class="prompt">${s.memory}</p></div>`;
    if(!state.life)return h+`<div class="dare-row"><button class="button dare-btn" id="lifeBtn">🎁 Reveal the personal milestone</button><span class="hint" style="margin:0">Told the story? Something else happened on this stop…</span></div>`;
    h+=`<div class="step two${freshStep?" fresh":""}"><div class="step-label">Step 2 · Personal milestone unlocked${st.life?`: <span class="lifechip">${st.life}</span>`:""}</div>`;
  }
  else if(st.life)h+=`<div class="step-label" style="color:#a0436f">Personal milestone: <span class="lifechip">${st.life}</span></div>`;
  h+=`<div class="icon" aria-hidden="true">${s.icon}</div><h2>${s.title}</h2><p class="prompt">${state.alt&&s.altPrompt?s.altPrompt:s.prompt}</p>`;
  if(s.talks)h+=`<div class="talks">${s.talks.map(t=>`<span class="talk">“${t}”</span>`).join("")}</div>`;
  if(s.hint)h+=`<p class="hint">${s.hint}</p>`;
  if(s.stations)h+=`<div class="answer" id="answer">${s.stations.map((x,i)=>`<span class="station"><small>Station ${i+1}</small>${x}</span>`).join('<span class="arrow" aria-hidden="true">→</span>')}</div><button class="button secondary" id="reveal" aria-expanded="false">Reveal answer</button>`;
  if(s.altPrompt)h+=` <button class="link" id="alt">${state.alt?s.mainLabel:s.altLabel}</button>`;
  if(s.memory)h+=`</div>`;
  freshStep=false;
  return h;
}

function finaleHTML(){
  const path=CITIES[START].n+state.history.map(h=>` → <em>${byId(h.id).ideal?"✨ ":""}${byId(h.id).name}</em> → ${CITIES[h.to].n}`).join("");
  return `<div class="finish"><div class="big" aria-hidden="true">♚🎓🎉</div><div class="counter">Checkmate</div><h2>${FINALE.heading}</h2><p>${FINALE.message}</p>${C.stations.some(x=>x.life)?`<div class="counter" style="margin-top:14px">${FINALE.doubleRouteTitle||"Your double route"}</div><div class="double"><span class="h" style="text-align:right">PhD</span><span></span><span class="h">Life</span>${C.stations.map(x=>`<span class="phd">${x.name}</span><span class="dot">●</span><span class="life">${x.life||""}</span>`).join("")}</div>`:""}
    ${FINALE.dare?`<div class="dare-card" style="text-align:left;margin:16px 0"><div class="dare-label">🎤 Final dare</div><p>${FINALE.dare}</p></div>`:""}
    <p class="recap">Your route: ${path}</p><div class="controls" style="justify-content:center"><button class="button secondary" id="restart">Ride again</button></div></div>`;
}

function stopCardHTML(s,n){
  const st=CITIES[LINE[n+1]];
  const tasks=[s.memory,state.alt&&s.altPrompt?s.altPrompt:s.prompt].filter(Boolean);
  return `<div class="counter">Stop ${n+1} of ${STOPS.length} · ${st.n}</div>
    ${st.life?`<div class="milestone">${st.life}</div>`:""}
    <h2>${s.title}</h2>
    ${tasks.length>1?`<ol class="tasks">${tasks.map(t=>`<li>${t}</li>`).join("")}</ol>`:`<p class="prompt">${tasks[0]}</p>`}
    ${s.altPrompt?`<button class="link" id="alt">${state.alt?s.mainLabel:s.altLabel}</button>`:""}
    <div class="controls"><button class="button primary" id="next">${n===STOPS.length-1?"Finish the journey 🎓":"Next stop →"}</button></div>`;
}

function renderStage(){
  const stage=document.getElementById("stage"), n=state.history.length, done=n>=STOPS.length;
  // ---- Compact bar under the map ----
  let bar=stubs();
  if(done){
    bar+=`<div class="bar"><span class="leg">🎓 Journey complete — welcome to the Defense station!</span><span class="bar-btns"><button class="button secondary" id="back">← Last stop</button>${state.cardOpen?"":`<button class="button primary" id="open">🎓 Open the finale</button>`}<button class="button secondary" id="restart2">Ride again</button></span></div>`;
  }else{
    const opts=options(), from=CITIES[state.city].n, to=CITIES[LINE[n+1]].n;
    const p=state.pending&&byId(state.pending);
    const fact=!p||!p.ideal||!state.revealed?"":state.fact===null
      ?` <span class="fact">🕵️ Fact check! <button class="button small" id="factYes">Believable ✅</button><button class="button small" id="factNo">Nice try! ❌</button></span>`
      :state.fact?` <span class="fact">🕵️ The room believes you.</span>`:` <span class="fact no">🕵️ Nice try, Dr. Kiran!</span>`;
    const status=!p?""
      :!state.revealed?(p.ideal?`🚂 Cruising the ideal path to ${to}… suspiciously smooth.`:`🚂 Fighting through “${p.name}”…`)
      :`${p.ideal?"✨":"🚧"} <strong>${p.name}</strong> — ${p.story}${fact}`;
    bar+=`<div class="bar"><span class="counter" style="margin:0">Stop ${n+1} of ${STOPS.length}</span>${status?`<span class="leg">${status}</span>`:""}<span class="bar-btns">${n?'<button class="button secondary" id="back">← Previous stop</button>':""}${state.revealed&&!state.cardOpen?`<button class="button primary${state.life?"":" draw"}" id="open">🎟️ ${state.life?"Show the card":"Draw the card"}</button>`:""}</span></div>`;
  }
  stage.innerHTML=bar;

  // ---- The ticket card (opens on arrival) ----
  const overlay=document.getElementById("overlay"), body=document.getElementById("cardBody");
  const show=state.cardOpen&&(done||state.revealed);
  overlay.hidden=!show;
  if(show){
    const keep=body.scrollTop, same=overlay.dataset.key===String(n);
    body.innerHTML=done?finaleHTML():stopCardHTML(STOPS[n],n);
    overlay.dataset.key=String(n);
    body.scrollTop=same?keep:0;
    if(!same)document.querySelector(".card").classList.remove("pop"),void document.querySelector(".card").offsetWidth,document.querySelector(".card").classList.add("pop");
  }else overlay.dataset.key="";

  const $=id=>document.getElementById(id), on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>chooseTrack(b.dataset.choice));
  on("factYes",()=>{state.fact=true;renderStage()});
  on("factNo",()=>{state.fact=false;renderStage()});
  on("lifeBtn",()=>{state.life=true;freshStep=true;render()});
  on("alt",()=>{state.alt=!state.alt;renderStage()});
  on("next",nextStop);
  on("back",previousStop);
  on("open",()=>{state.cardOpen=true;state.life=true;render()});
  on("restart",restart); on("restart2",restart);
}
function render(){renderMap();renderStage()}

/* ---------- Finale confetti (no libraries) ---------- */
function confetti(){
  if(reduceMotion)return;
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=["#c95045","#f3c65e","#286c8e","#3a806c","#17324d"];
  const bits=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,c:colors[Math.random()*5|0]}));
  const t0=performance.now(), tok=++confettiToken;
  (function f(now){
    if(tok!==confettiToken){ctx.clearRect(0,0,cv.width,cv.height);return}
    ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-3,b.w,6);ctx.restore()});
    if(now-t0<4500)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

document.getElementById("closeCard").onclick=()=>{state.cardOpen=false;renderStage()};
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay"){state.cardOpen=false;renderStage()}});
addEventListener("keydown",e=>{if(e.key==="Escape"&&state.cardOpen){state.cardOpen=false;renderStage()}});
trainAtCity(START);
render();
</script>
</body>
</html>
